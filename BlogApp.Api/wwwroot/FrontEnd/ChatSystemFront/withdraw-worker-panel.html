<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Worker Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --gold-dim: #8a6f2e;
            --bg: #070d0a;
            --surface: #0f1a12;
            --surface2: #142018;
            --surface3: #1a2a1e;
            --border: rgba(201,168,76,0.15);
            --border2: rgba(201,168,76,0.08);
            --text: #e0d8c8;
            --text-dim: #7a7060;
            --green: #2d7a4f;
            --green-dim: rgba(45,122,79,0.15);
            --red: #c0392b;
            --red-dim: rgba(192,57,43,0.15);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Raleway', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            background-image: radial-gradient(ellipse 60% 40% at 20% 0%, rgba(45,122,79,0.06) 0%, transparent 60%);
        }

        .sidebar {
            width: 240px;
            background: var(--surface);
            border-right: 1px solid var(--border2);
            display: flex;
            flex-direction: column;
            padding: 28px 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 0 24px 28px;
            border-bottom: 1px solid var(--border2);
            margin-bottom: 20px;
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.08em;
        }

        .logo-sub {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .user-card {
            margin: 0 16px 20px;
            padding: 14px 16px;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--green), #1a3a25);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .user-role {
            display: inline-block;
            margin-top: 8px;
            font-size: 10px;
            background: var(--green-dim);
            color: #4ade80;
            border: 1px solid rgba(45,122,79,0.3);
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .nav-item {
            margin: 2px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-dim);
            transition: all 0.2s;
            text-decoration: none;
            border: 1px solid transparent;
        }

            .nav-item:hover {
                background: var(--surface2);
                color: var(--text);
            }

            .nav-item.active {
                background: rgba(201,168,76,0.1);
                color: var(--gold);
                border-color: rgba(201,168,76,0.15);
            }

        .nav-badge {
            margin-left: auto;
            background: var(--gold);
            color: #1a1000;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
        }

            .nav-badge.red {
                background: var(--red);
                color: white;
            }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 12px 0;
            border-top: 1px solid var(--border2);
        }

        .logout-btn {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            color: var(--text-dim);
            font-family: 'Raleway', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

            .logout-btn:hover {
                background: var(--red-dim);
                color: #f87171;
                border-color: rgba(192,57,43,0.3);
            }

        .main {
            margin-left: 240px;
            flex: 1;
            padding: 32px 36px;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-title {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.04em;
        }

        .page-sub {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 14px;
            padding: 20px 22px;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .stat-value {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--gold-light);
        }

        .stat-sub {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gold-dim);
        }

        .refresh-btn {
            padding: 6px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--gold-dim);
            font-size: 12px;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            transition: all 0.2s;
        }

            .refresh-btn:hover {
                color: var(--gold);
                border-color: var(--gold-dim);
            }

        .requests-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .request-card {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 14px;
            padding: 18px 22px;
            transition: all 0.25s;
            animation: fadeIn 0.4s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .request-card:hover {
            border-color: var(--border);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        .request-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .req-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--surface3);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 15px;
            color: var(--gold-dim);
            flex-shrink: 0;
        }
        .req-balance {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .req-info {
            flex: 1;
        }

        .req-username {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .req-meta {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .req-right {
            text-align: right;
        }

        .req-amount {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--gold-light);
        }

        .req-wallet {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 2px;
            word-break: break-all;
            max-width: 160px;
        }

        .note-input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
            margin-bottom: 12px;
            resize: none;
            height: 64px;
        }

            .note-input:focus {
                border-color: var(--gold-dim);
            }

            .note-input::placeholder {
                color: var(--text-dim);
            }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .btn-accept {
            flex: 1;
            padding: 11px;
            background: rgba(45,122,79,0.2);
            border: 1px solid rgba(45,122,79,0.4);
            border-radius: 10px;
            color: #4ade80;
            font-family: 'Raleway', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.04em;
        }

            .btn-accept:hover {
                background: rgba(45,122,79,0.35);
                box-shadow: 0 4px 16px rgba(45,122,79,0.2);
            }

        .btn-reject {
            flex: 1;
            padding: 11px;
            background: rgba(192,57,43,0.15);
            border: 1px solid rgba(192,57,43,0.3);
            border-radius: 10px;
            color: #f87171;
            font-family: 'Raleway', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.04em;
        }

            .btn-reject:hover {
                background: rgba(192,57,43,0.25);
                box-shadow: 0 4px 16px rgba(192,57,43,0.2);
            }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 14px;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-text {
            font-size: 14px;
            color: var(--text-dim);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 13px;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(.22,.68,0,1.2);
            z-index: 999;
        }

            .toast.show {
                transform: translateY(0);
                opacity: 1;
            }

            .toast.success {
                border-color: var(--green);
            }

            .toast.error {
                border-color: var(--red);
            }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-text">⬡ GZ Casino</div>
            <div class="logo-sub">Withdraw Panel</div>
        </div>
        <div class="user-card">
            <div class="user-avatar">WW</div>
            <div class="user-name">Withdraw Worker</div>
            <span class="user-role">Worker</span>
        </div>
        <nav>
            <a class="nav-item active" onclick="switchTab('pending')">
                📤 Yeni Sorğular <span class="nav-badge" id="pendingBadge">0</span>
            </a>
            <a class="nav-item" onclick="switchTab('approved')">
                ✓ Qəbul Edilənlər <span class="nav-badge" id="approvedBadge">0</span>
            </a>
            <a class="nav-item" onclick="switchTab('rejected')">
                ✗ Rədd Edilənlər <span class="nav-badge red" id="rejectedBadge">0</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()">⎋ Çıxış</button>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <div class="page-title">Withdraw Requests Panel</div>
            <div class="page-sub">Çıxarış sorğularını yoxla və Bank panelinə yönləndir.</div>
        </div>
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="statPending">0</div>
                <div class="stat-sub">Gözləyir</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending Məbləğ</div>
                <div class="stat-value" id="statAmount">$0</div>
                <div class="stat-sub">Ümumi</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Həll Edilən</div>
                <div class="stat-value" id="statHandled">0</div>
                <div class="stat-sub">Cəmi</div>
            </div>
        </div>
        <div class="section-header">
            <div class="section-title" id="sectionTitle">Yeni Sorğular</div>
            <button class="refresh-btn" onclick="loadAll()">↻ Yenilə</button>
        </div>
        <div class="requests-grid" id="requestsGrid">
            <div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Yüklənir...</div></div>
        </div>
    </main>

    <div class="toast" id="toast"></div>
    <script>
        const API_BASE = '/api';

        function getToken() {
            const match = document.cookie.match(/(?:^|;\s*)token=([^;]*)/);
            return match ? decodeURIComponent(match[1]) : null;
        }
        function authHeaders(json = false) {
            const h = {};
            const token = getToken();
            if (token) h['Authorization'] = `Bearer ${token}`;
            if (json) h['Content-Type'] = 'application/json';
            return h;
        }

        let currentTab = 'pending';
        let allRequests = { pending: [], approved: [], rejected: [] };

        async function loadAll() {
            try {
                const [pendRes, histRes] = await Promise.all([
                    fetch(`${API_BASE}/withdraw/worker/pending`, { headers: authHeaders() }),
                    fetch(`${API_BASE}/withdraw/worker/history`, { headers: authHeaders() })
                ]);
                if (pendRes.status === 401 || histRes.status === 401) { showToast('Sessiya bitib', 'error'); return; }
                const pending = pendRes.ok ? await pendRes.json() : [];
                const history = histRes.ok ? await histRes.json() : [];
                allRequests.pending = pending;
                allRequests.approved = history.filter(r => r.statusText === 'WorkerApproved' || r.statusText === 'BankApproved' || r.statusText === 'BankRejected');
                allRequests.rejected = history.filter(r => r.statusText === 'WorkerRejected');
            } catch { showToast('API-yə qoşulmaq mümkün olmadı', 'error'); }
            updateStats(); updateBadges(); renderTab();
        }

        function updateStats() {
            const p = allRequests.pending;
            document.getElementById('statPending').textContent = p.length;
            const total = p.reduce((s, r) => s + r.amount, 0);
            document.getElementById('statAmount').textContent = '$' + total.toLocaleString('en', { minimumFractionDigits: 2 });
            document.getElementById('statHandled').textContent = allRequests.approved.length + allRequests.rejected.length;
        }

        function updateBadges() {
            document.getElementById('pendingBadge').textContent = allRequests.pending.length;
            document.getElementById('approvedBadge').textContent = allRequests.approved.length;
            document.getElementById('rejectedBadge').textContent = allRequests.rejected.length;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach((el, i) =>
                el.classList.toggle('active', ['pending', 'approved', 'rejected'][i] === tab));
            const titles = { pending: 'Yeni Sorğular', approved: 'Qəbul Edilənlər', rejected: 'Rədd Edilənlər' };
            document.getElementById('sectionTitle').textContent = titles[tab];
            renderTab();
        }

        function renderTab() {
            const list = allRequests[currentTab];
            const grid = document.getElementById('requestsGrid');
            if (!list.length) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Sorğu yoxdur</div></div>`;
                return;
            }
            grid.innerHTML = list.map((r, i) => {
                const date = new Date(r.createDate).toLocaleDateString('az-AZ', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                const initials = r.userName.slice(0, 2).toUpperCase();
                const isPending = r.statusText === 'Pending';
                const statusLabel = {
                    'WorkerApproved': '⏳ Bank gözləyir',
                    'BankApproved':   '✓ Bank təsdiqledi',
                    'BankRejected':   '✗ Bank rədd etdi',
                    'WorkerRejected': '✗ Rədd edildi'
                }[r.statusText] || '';

                return `
                <div class="request-card" style="animation-delay:${i * 0.06}s" id="req-${r.id}">
                    <div class="request-top">
                        <div class="req-avatar">${initials}</div>
                       <div class="req-info">
                            <div class="req-username">${r.userName}</div>
                            <div class="req-meta">U-${r.userId} · W-${r.id} · ${date}</div>
                            <div class="req-balance">
                                💰 Balans: <span style="color: ${r.userBalance < r.amount ? '#f87171' : '#4ade80'}; font-weight: 600;">
                                    $${parseFloat(r.userBalance).toFixed(2)}
                                </span>
                                ${r.userBalance < r.amount ? '<span style="font-size:10px;color:#f87171;margin-left:4px;">⚠ Çatışmır</span>' : ''}
                            </div>
                        </div>
                        <div class="req-right">
                            <div class="req-amount">$${parseFloat(r.amount).toFixed(2)}</div>
                            <div class="req-wallet">${r.walletAddress}</div>
                        </div>
                    </div>
                    ${isPending ? `
                        <textarea class="note-input" id="note-${r.id}" placeholder="Qeyd əlavə et (ixtiyari)..."></textarea>
                        <div class="action-row">
                            <button class="btn-accept" onclick="workerReview(${r.id}, true)">✓ Qəbul Et → Bank</button>
                            <button class="btn-reject" onclick="workerReview(${r.id}, false)">✗ Rədd Et</button>
                        </div>
                    ` : `
                        <div style="font-size:12px;color:var(--text-dim);padding:8px 12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center">
                            <span><strong style="color:var(--gold-dim)">Qəbul edən:</strong> ${r.reviewedByWorkerName || '—'} · <strong style="color:var(--gold-dim)">Qeyd:</strong> ${r.workerNote || '—'}</span>
                            <span style="font-size:11px;font-weight:600;color:${r.statusText === 'BankApproved' ? '#4ade80' : r.statusText === 'BankRejected' ? '#f87171' : 'var(--gold)'}">${statusLabel}</span>
                        </div>
                    `}
                </div>`;
            }).join('');
        }

        async function workerReview(id, isApproved) {
            const note = document.getElementById(`note-${id}`)?.value || '';
            const btnSel = isApproved ? '.btn-accept' : '.btn-reject';
            const btn = document.querySelector(`#req-${id} ${btnSel}`);
            if (btn) { btn.disabled = true; btn.textContent = '...'; }
            try {
                const res = await fetch(`${API_BASE}/withdraw/worker/review`, {
                    method: 'POST',
                    headers: authHeaders(true),
                    body: JSON.stringify({ withdrawRequestId: id, isApproved, note })
                });
                if (res.status === 401) { showToast('Sessiya bitib', 'error'); return; }
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'Xəta baş verdi');
                }
                showToast(isApproved ? '✓ Bank panelinə göndərildi' : '✗ Sorğu rədd edildi', isApproved ? 'success' : 'error');
                const req = allRequests.pending.find(r => r.id === id);
                if (req) {
                    req.statusText = isApproved ? 'WorkerApproved' : 'WorkerRejected';
                    req.workerNote = note;
                    allRequests.pending = allRequests.pending.filter(r => r.id !== id);
                    if (isApproved) allRequests.approved.unshift(req);
                    else allRequests.rejected.unshift(req);
                }
                updateStats(); updateBadges(); renderTab();
            } catch (err) {
                showToast(err.message, 'error');
                if (btn) { btn.disabled = false; btn.textContent = isApproved ? '✓ Qəbul Et → Bank' : '✗ Rədd Et'; }
            }
        }

        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = `toast ${type} show`;
            setTimeout(() => t.classList.remove('show'), 3500);
        }
        function logout() {
            document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            window.location.href = '/login.html';
        }

        loadAll();
        setInterval(loadAll, 30000);
    </script>
</body>
</html>
