<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Support Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .header h1 {
                font-size: 28px;
            }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-info {
            text-align: right;
            font-size: 14px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

            .logout-btn:hover {
                background: white;
                color: #667eea;
            }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-filter {
            background: #f0f0f0;
            color: #333;
        }

            .btn-filter.active {
                background: #667eea;
                color: white;
            }

            .btn-filter:hover {
                background: #667eea;
                color: white;
            }

        .btn-refresh {
            background: #28a745;
            color: white;
            margin-left: auto;
        }

            .btn-refresh:hover {
                background: #218838;
            }

        .spinner-small {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Table */
        .table-wrapper {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-open {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-closed {
            background: #d4edda;
            color: #155724;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-view {
            background: #667eea;
            color: white;
        }

            .btn-view:hover {
                background: #5568d3;
            }

        .btn-close {
            background: #28a745;
            color: white;
        }

            .btn-close:hover {
                background: #218838;
            }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 18px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .error-banner {
            background: #f8d7da;
            color: #721c24;
            padding: 16px 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #f5c6cb;
            display: none;
        }

            .error-banner.show {
                display: block;
            }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .modal-header h2 {
                font-size: 20px;
            }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

            .close-modal:hover {
                background: rgba(255, 255, 255, 0.2);
                border-radius: 50%;
            }

        .modal-body {
            padding: 30px;
        }

        .detail-row {
            margin-bottom: 20px;
        }

        .detail-label {
            font-weight: 600;
            color: #667eea;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .detail-value {
            color: #333;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            word-break: break-word;
            line-height: 1.6;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

            .modal-footer .btn {
                padding: 10px 20px;
            }

        .btn-primary-modal {
            background: #667eea;
            color: white;
        }

            .btn-primary-modal:hover {
                background: #5568d3;
            }

        .btn-success-modal {
            background: #28a745;
            color: white;
        }

            .btn-success-modal:hover {
                background: #218838;
            }

        .btn-secondary-modal {
            background: #6c757d;
            color: white;
        }

            .btn-secondary-modal:hover {
                background: #5a6268;
            }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #999;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .header-right {
                justify-content: center;
            }

            .controls {
                flex-direction: column;
            }

            .btn-refresh {
                margin-left: 0;
                width: 100%;
            }

            .btn-group {
                width: 100%;
                flex-wrap: wrap;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 12px 8px;
            }

            .actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }

        .no-permission {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <!-- Error Banner -->
    <div class="error-banner" id="errorBanner"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>📞 Support Müraciətləri</h1>
                <p style="margin-top: 5px; opacity: 0.9;">Müştəri məsələlərini idarə edin</p>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div id="userName">Admin</div>
                    <div style="font-size: 12px; opacity: 0.8;">Yönetici</div>
                </div>
                <button class="logout-btn" onclick="logout()">🚪 Çıkış</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats" id="statsContainer" style="display: none;">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Cəmi Müraciət</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="openCount">0</div>
                <div class="stat-label">Açıq Müraciətlər</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="closedCount">0</div>
                <div class="stat-label">Bağlı Müraciətlər</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-filter active" onclick="filterByStatus(0)">📋 Hamısı</button>
                <button class="btn btn-filter" onclick="filterByStatus(1)">🔴 Açıq</button>
                <button class="btn btn-filter" onclick="filterByStatus(2)">✅ Bağlı</button>
            </div>
            <button class="btn btn-refresh" onclick="loadTickets()">
                <span id="refreshSpinner"></span>
                <span>🔄 Yenilə</span>
            </button>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
            <div id="tableContainer">
                <div class="loading">⏳ Yüklənir...</div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔍 Müraciət Detalları</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dinamik məzmun -->
            </div>
            <div class="modal-footer">
                <button class="btn action-btn btn-secondary-modal" onclick="closeModal()">Bağla</button>
                <button class="btn action-btn btn-success-modal" id="closeTicketBtn" onclick="closeTicket()" style="display: none;">
                    ✅ Müraciəti Bağla
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/support';
        let currentFilter = 0;
        let currentTicketId = null;
        let tickets = [];

        // Token-i cookie-dən oxu
        function getToken() {
            const raw = document.cookie
                .split("; ")
                .find(row => row.startsWith("AuthToken="))
                ?.split("=")[1];
            if (!raw) return "";
            let token = decodeURIComponent(raw).trim();
            if (token.endsWith(".")) token = token.slice(0, -1);
            return token;
        }

        // Səhifə yükləndikdə
        document.addEventListener('DOMContentLoaded', () => {
            const token = getToken();
            if (!token) {
                showNoPermission();
                return;
            }
            loadTickets();
            // Hər 30 saniyə yenilə
            setInterval(loadTickets, 30000);
        });

        // Müraciətləri yüklə
        async function loadTickets() {
            const container = document.getElementById('tableContainer');

            try {
                const token = getToken();
                if (!token) {
                    showNoPermission();
                    return;
                }

                const url = currentFilter > 0
                    ? `${API_BASE}/admin/list?status=${currentFilter}`
                    : `${API_BASE}/admin/list`;

                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });

                if (response.status === 401) {
                    showNoPermission();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                tickets = await response.json();
                renderTable();
                updateStats();

            } catch (error) {
                showError(error.message);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p>Müraciətlər yüklənə bilədi</p>
                        <p style="font-size: 12px; margin-top: 10px; color: #ccc;">${error.message}</p>
                    </div>
                `;
            }
        }

        // Cədvəli göstər
        function renderTable() {
            const container = document.getElementById('tableContainer');

            if (tickets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>Müraciət tapılmadı</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Ad</th>
                            <th>Email</th>
                            <th>Mövzu</th>
                            <th>Status</th>
                            <th>Tarix</th>
                            <th>Əməliyyat</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            tickets.forEach(ticket => {
                const statusClass = ticket.status === 1 ? 'status-open' : 'status-closed';
                const statusText = ticket.status === 1 ? 'Açıq' : 'Bağlı';
                const date = new Date(ticket.createdAt).toLocaleDateString('az-AZ', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                const time = new Date(ticket.createdAt).toLocaleTimeString('az-AZ', {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                html += `
                    <tr>
                        <td><strong>#${ticket.id}</strong></td>
                        <td>${escapeHtml(ticket.fullName)}</td>
                        <td>${escapeHtml(ticket.email)}</td>
                        <td>${escapeHtml(ticket.subject)}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${date} ${time}</td>
                        <td>
                            <div class="actions">
                                <button class="action-btn btn-view" onclick="viewTicket(${ticket.id})">👁 Bax</button>
                                ${ticket.status === 1 ? `<button class="action-btn btn-close" onclick="closeTicketDirect(${ticket.id})">✅ Bağla</button>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;
            container.innerHTML = html;
        }

        // Statistikaları güncəllə
        function updateStats() {
            const total = tickets.length;
            const open = tickets.filter(t => t.status === 1).length;
            const closed = tickets.filter(t => t.status === 2).length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('openCount').textContent = open;
            document.getElementById('closedCount').textContent = closed;
            document.getElementById('statsContainer').style.display = 'grid';
        }

        // Müraciəti göstər
        async function viewTicket(id) {
            try {
                const token = getToken();
                const response = await fetch(`${API_BASE}/admin/${id}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });

                if (!response.ok) throw new Error('Yüklənə bilədi');

                const ticket = await response.json();
                currentTicketId = ticket.id;

                const statusText = ticket.status === 1 ? 'Açıq' : 'Bağlı';
                const statusClass = ticket.status === 1 ? 'status-open' : 'status-closed';
                const date = new Date(ticket.createdAt).toLocaleString('az-AZ');

                document.getElementById('modalBody').innerHTML = `
                    <div class="detail-row">
                        <div class="detail-label">Ticket ID</div>
                        <div class="detail-value">#${ticket.id}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Ad Soyad</div>
                        <div class="detail-value">${escapeHtml(ticket.fullName)}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Email</div>
                        <div class="detail-value">${escapeHtml(ticket.email)}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Mövzu</div>
                        <div class="detail-value">${escapeHtml(ticket.subject)}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Mesaj</div>
                        <div class="detail-value">${escapeHtml(ticket.message)}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Status</div>
                        <div class="detail-value">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Təsis Tarixi</div>
                        <div class="detail-value">${date}</div>
                    </div>
                `;

                document.getElementById('closeTicketBtn').style.display = ticket.status === 1 ? 'block' : 'none';
                document.getElementById('detailModal').classList.add('show');
            } catch (error) {
                showError(error.message);
            }
        }

        // Müraciəti bağla (modaldan)
        async function closeTicket() {
            if (!currentTicketId) return;

            if (!confirm('Müraciəti bağlamaq istəyirsiniz?')) return;

            try {
                const token = getToken();
                const response = await fetch(`${API_BASE}/admin/${currentTicketId}/close`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });

                if (!response.ok) throw new Error('Bağlana bilədi');

                closeModal();
                showSuccess('Müraciət bağlanmışdır');
                loadTickets();
            } catch (error) {
                showError(error.message);
            }
        }

        // Müraciəti bağla (cədvəldən birbaşa)
        async function closeTicketDirect(id) {
            if (!confirm('Müraciəti bağlamaq istəyirsiniz?')) return;

            try {
                const token = getToken();
                const response = await fetch(`${API_BASE}/admin/${id}/close`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });

                if (!response.ok) throw new Error('Bağlana bilədi');

                showSuccess('Müraciət bağlanmışdır');
                loadTickets();
            } catch (error) {
                showError(error.message);
            }
        }

        // Status-a görə filtrə
        function filterByStatus(status) {
            currentFilter = status;

            // Düyməni highlight et
            document.querySelectorAll('.btn-filter').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            loadTickets();
        }

        // Modali bağla
        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
            currentTicketId = null;
        }

        // Çıkış et
        function logout() {
            if (confirm('Çıxış etmək istəyirsiniz?')) {
                localStorage.clear();
                window.location.href = '/login';
            }
        }

        // Xəta mesajı
        function showError(message) {
            const banner = document.getElementById('errorBanner');
            banner.textContent = '❌ ' + message;
            banner.classList.add('show');
            setTimeout(() => {
                banner.classList.remove('show');
            }, 4000);
        }

        // Uğun mesajı
        function showSuccess(message) {
            const banner = document.getElementById('errorBanner');
            banner.textContent = '✅ ' + message;
            banner.style.background = '#d4edda';
            banner.style.color = '#155724';
            banner.style.borderColor = '#c3e6cb';
            banner.classList.add('show');
            setTimeout(() => {
                banner.classList.remove('show');
                banner.style.background = '#f8d7da';
                banner.style.color = '#721c24';
                banner.style.borderColor = '#f5c6cb';
            }, 4000);
        }

        // İcazə yoxdursa
        function showNoPermission() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="no-permission">
                    <div style="font-size: 48px; margin-bottom: 20px;">🔒</div>
                    <h2>İcazə Rədd Edildi</h2>
                    <p style="margin-top: 10px;">Bu səhifəyə giriş icazəsi yoxdur.</p>
                    <p style="font-size: 13px; margin-top: 15px; opacity: 0.7;">Admin hüququ ilə giriş etməlisiniz.</p>
                    <button class="btn btn-primary-modal" style="margin-top: 20px; width: 150px;" onclick="window.location.href='/login'">
                        Girişə Qayıt
                    </button>
                </div>
            `;
        }

        // XSS protection
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Modal-ı klikləmə ilə bağla
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
