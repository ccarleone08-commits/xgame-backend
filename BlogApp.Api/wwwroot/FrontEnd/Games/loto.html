<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>10 Line Loto - Oyun</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #2d1b69 0%, #1a0f3d 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .win-rule-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            color: #000;
        }

        .jackpot-display {
            background: linear-gradient(135deg, #ffd166, #ff9a3c);
            color: #000;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: 900;
        }

        .balance-display {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

            .btn:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        }

        .drawn-number {
            text-align: center;
            margin-bottom: 30px;
        }

        .big-ball {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd166, #ffb703);
            color: #000;
            font-size: 72px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 20px 60px rgba(255, 209, 102, 0.3);
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .history {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .history-ball {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .tickets-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .ticket {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 209, 102, 0.3);
            border-radius: 20px;
            padding: 20px;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .ticket-number {
            font-size: 20px;
            font-weight: 900;
            color: #ffd166;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
            margin-bottom: 15px;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.3s;
        }

            .cell.blank {
                background: transparent;
            }

            .cell.marked {
                background: linear-gradient(135deg, #6ee7b7, #2dd4bf);
                color: #000;
                transform: scale(0.95);
            }

        .btn-refresh {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s;
        }

            .btn-refresh:hover:not(:disabled) {
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                transform: translateY(-2px);
            }

        .btn-delete {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s;
        }

            .btn-delete:hover:not(:disabled) {
                background: linear-gradient(135deg, #b91c1c, #991b1b);
                transform: translateY(-2px);
            }

            .btn-refresh:disabled,
            .btn-delete:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

            .modal.show {
                display: flex;
            }

        .modal-content {
            background: linear-gradient(135deg, #2d1b69, #1a0f3d);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 900px;
            width: 100%;
            border: 4px solid #ffd166;
            box-shadow: 0 20px 60px rgba(255, 209, 102, 0.5);
            animation: zoomIn 0.5s ease;
            position: relative;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .countdown-timer {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 24px;
            color: #ffd166;
            font-weight: 900;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ffd166;
        }

        .modal-content h2 {
            font-size: 56px;
            margin-bottom: 10px;
            color: #ffd166;
            text-shadow: 0 4px 20px rgba(255, 209, 102, 0.8);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }
        }

        .winner-name {
            font-size: 36px;
            margin-bottom: 10px;
            color: #fff;
            font-weight: 900;
        }

        .prize-amount {
            font-size: 48px;
            color: #ffd166;
            font-weight: 900;
            margin: 20px 0;
            text-shadow: 0 2px 10px rgba(255, 209, 102, 0.5);
        }

        .win-type-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 18px;
            color: #000;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .winner-card-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid rgba(255, 209, 102, 0.3);
        }

            .winner-card-display h3 {
                margin-bottom: 20px;
                color: #ffd166;
                font-size: 24px;
            }

        .winner-card-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 8px;
            max-width: 700px;
            margin: 0 auto;
        }

        .winner-cell {
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            border: 3px solid transparent;
            transition: all 0.3s;
        }

            .winner-cell.blank {
                background: transparent;
                border: none;
            }

            .winner-cell.winning {
                background: linear-gradient(135deg, #ffd166, #ff9a3c);
                color: #000;
                border-color: #fff;
                box-shadow: 0 4px 20px rgba(255, 209, 102, 0.6);
                animation: winPulse 1s infinite;
            }

            .winner-cell.not-drawn {
                background: rgba(255, 255, 255, 0.1);
                color: #999;
                border: 2px solid rgba(255, 255, 255, 0.2);
            }

        @keyframes winPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ffd166, #ff9a3c);
            color: #000;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 10000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .closest-alert {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            z-index: 10000;
            animation: slideIn 0.3s ease;
            display: none;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div class="closest-alert" id="closestAlert"></div>
    <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="jackpot-display">
                🏆 <span id="jackpotAmount">0.00</span> ₼
            </div>
            <div class="win-rule-badge" id="winRuleBadge">TAM KART</div>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="balance-display">💰 <span id="userBalance">0.00</span> ₼</div>
            <button id="buyTicketBtn" class="btn">+ Bilet Al</button>
            <button id="backBtn" class="btn btn-danger">← Çıx</button>
        </div>
    </div>

    <div class="drawn-number">
        <div class="big-ball" id="bigBall">--</div>
        <div class="history" id="history"></div>
    </div>

    <div class="tickets-container" id="ticketsContainer"></div>

    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <div class="countdown-timer" id="countdownTimer">10</div>
            <h2>🏆 QALİB 🏆</h2>
            <div class="winner-name" id="winnerName"></div>
            <div class="win-type-badge" id="winTypeBadge"></div>
            <div class="prize-amount" id="prizeAmount"></div>
            <div class="winner-card-display">
                <h3>🎫 Qazanan Bilet</h3>
                <div class="winner-card-grid" id="winnerCardGrid"></div>
            </div>
            <button class="btn" onclick="goToLobby()"
                    style="margin-top: 20px; font-size: 18px; padding: 15px 40px;">
                Lobbiyə Qayıt
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');

        let connection = null;
        let myTickets = [];
        let drawnNumbers = [];
        let isGameStarted = false;
        let winRule = "TAM KART";
        let timerInterval = null;
        let lastTimerValue = -1;
        let countdownInterval = null;

        function getToken() {
            const raw = document.cookie
                .split("; ")
                .find(row => row.startsWith("AuthToken="))
                ?.split("=")[1];
            if (!raw) return "";
            let token = decodeURIComponent(raw).trim();
            if (token.endsWith(".")) token = token.slice(0, -1);
            return token;
        }

        function showNotification(message) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        function createConnection() {
            connection = new signalR.HubConnectionBuilder()
                .withUrl("/lotoHub", {
                    accessTokenFactory: () => getToken()
                })
                .withAutomaticReconnect()
                .configureLogging(signalR.LogLevel.Information)
                .build();

            setupHandlers();
            return connection;
        }

        function setupHandlers() {
            console.log("📡 Setting up SignalR handlers...");

            connection.on("UserData", (data) => {
                const balanceEl = document.getElementById("userBalance");
                if (balanceEl) {
                    balanceEl.textContent = data.balance.toFixed(2);
                }
            });

             connection.on("RoomJoined", (data) => {
                myTickets = data.myTickets;
                isGameStarted = data.isGameStarted;
                drawnNumbers = data.drawnNumbers || [];
                winRule = data.winRule || "TAM KART";

                const jackpotEl = document.getElementById("jackpotAmount");
                if (jackpotEl) {
                    jackpotEl.textContent = data.jackpot.toFixed(2);
                }

                const winRuleEl = document.getElementById("winRuleBadge");
                if (winRuleEl) {
                    winRuleEl.textContent = winRule;
                }

                renderTickets();
                updateHistory();

                if (!isGameStarted && data.timeRemaining > 0) {
                    lastTimerValue = data.timeRemaining;
                    startTimer(data.timeRemaining);
                }
            });

            connection.on("TicketPurchased", (data) => {
                myTickets.push({ ticketId: data.ticketId, card: data.card });

                const balanceEl = document.getElementById("userBalance");
                if (balanceEl) {
                    balanceEl.textContent = data.balance.toFixed(2);
                }

                showNotification(`✅ Bilet ${data.ticketNumber}/${data.maxTickets} alındı`);
                renderTickets();
            });

            connection.on("TicketRefreshed", (data) => {
                const ticketIndex = myTickets.findIndex(t => t.ticketId === data.ticketId);
                if (ticketIndex !== -1) {
                    myTickets[ticketIndex].card = data.card;
                    renderTickets();
                    showNotification("✅ Bilet yeniləndi!");
                }
            });

            connection.on("TicketDeleted", (ticketId) => {
                myTickets = myTickets.filter(t => t.ticketId !== ticketId);
                renderTickets();
                showNotification("✅ Bilet silindi və balans qaytarıldı!");
            });

            connection.on("RoomUpdated", (data) => {
                const jackpotEl = document.getElementById("jackpotAmount");
                if (jackpotEl) {
                    jackpotEl.textContent = data.jackpot.toFixed(2);
                }

                if (!isGameStarted && data.timeRemaining > 0) {
                    if (Math.abs(data.timeRemaining - lastTimerValue) > 5 || lastTimerValue === -1) {
                        lastTimerValue = data.timeRemaining;
                        startTimer(data.timeRemaining);
                    }
                } else if (data.timeRemaining === 0 && !isGameStarted) {
                    stopTimer();
                }
            });

            connection.on("GameStarted", (data) => {
                isGameStarted = true;

                const buyBtn = document.getElementById("buyTicketBtn");
                if (buyBtn) {
                    buyBtn.disabled = true;
                }

                showNotification("🎮 Oyun başladı!");

                if (typeof confetti !== 'undefined') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }

                document.querySelectorAll('.btn-refresh, .btn-delete').forEach(btn => {
                    btn.disabled = true;
                });

                stopTimer();
            });

            connection.on("NumberDrawn", (num) => {
                drawnNumbers.push(num);

                const bigBall = document.getElementById("bigBall");
                if (bigBall) {
                    bigBall.textContent = num;
                }

                updateHistory();
                markNumber(num);
            });

            connection.on("ClosestCardUpdate", (data) => {
                console.log("🔥 ClosestCardUpdate gəldi:", data);

                let alertBox = document.getElementById("closestAlert");
                if (!alertBox) {
                    alertBox = document.createElement("div");
                    alertBox.id = "closestAlert";
                    document.body.appendChild(alertBox);
                }

                if (data.remaining === 1) {
                    alertBox.style.background = "linear-gradient(135deg, #ff4444, #cc0000)";
                    alertBox.style.color = "#fff";
                } else if (data.remaining <= 3) {
                    alertBox.style.background = "linear-gradient(135deg, #ff8800, #ff5500)";
                    alertBox.style.color = "#fff";
                } else {
                    alertBox.style.background = "linear-gradient(135deg, #ffd166, #ff9a3c)";
                    alertBox.style.color = "#000";
                }

                alertBox.style.cssText += `
                    display: block !important;
                    position: fixed;
                    top: 80px;
                    left: 50%;
                    transform: translateX(-50%);
                    padding: 12px 28px;
                    border-radius: 50px;
                    font-size: 18px;
                    font-weight: 800;
                    z-index: 10000;
                    text-align: center;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
                `;

                alertBox.textContent = data.message;

                clearTimeout(alertBox._hideTimeout);
                alertBox._hideTimeout = setTimeout(() => {
                    alertBox.style.display = "none";
                }, 4000);
            });

            connection.on("BalanceUpdated", (balance) => {
                const balanceEl = document.getElementById("userBalance");
                if (balanceEl) {
                    balanceEl.textContent = balance.toFixed(2);
                }
            });

            connection.on("GameOver", (data) => {
                console.log("🏆 ========== GAME OVER EVENT ALINDI ==========");
                console.log("📦 Full Data:", JSON.stringify(data, null, 2));

                let winnerText = data.winner || "Naməlum";
                if (data.isBot) {
                    winnerText += ' 🤖';
                }

                const winnerNameEl = document.getElementById("winnerName");
                if (winnerNameEl) {
                    winnerNameEl.textContent = winnerText;
                }

                const winTypeBadge = document.getElementById("winTypeBadge");
                if (winTypeBadge) {
                    winTypeBadge.textContent = data.winType || "BİR XƏTT";
                }

                const prize = data.netPrize || data.prize || 0;
                const prizeEl = document.getElementById("prizeAmount");
                if (prizeEl) {
                    prizeEl.textContent = `${prize.toFixed(2)} ₼`;
                }

                if (data.winningCard) {
                    displayWinningCard(data.winningCard);
                } else {
                    console.error("❌ winningCard məlumatı yoxdur!");
                }

                const modal = document.getElementById("gameOverModal");
                if (modal) {
                    modal.classList.add("show");
                    console.log("✅ Modal açıldı!");
                }

                if (typeof confetti !== 'undefined') {
                    confetti({
                        particleCount: 200,
                        spread: 120,
                        origin: { y: 0.5 },
                        colors: ['#ffd166', '#ff9a3c', '#2dd4bf', '#fff']
                    });

                    setTimeout(() => {
                        confetti({
                            particleCount: 150,
                            angle: 60,
                            spread: 80,
                            origin: { x: 0 }
                        });
                        confetti({
                            particleCount: 150,
                            angle: 120,
                            spread: 80,
                            origin: { x: 1 }
                        });
                    }, 300);
                }

                startCountdown();
            });

            connection.on("RoomListUpdated", () => {
                console.log("📋 Otaq siyahısı yeniləndi");
            });

            connection.on("BotTicketAdded", (data) => {
                console.log("🤖 Bot bileti əlavə olundu:", data.playerName);
            });

            connection.on("RoomReset", () => {
                console.log("🔄 OTAQ RESET EDİLDİ");
            });
        }

        function startCountdown() {
            let remaining = 10;
            const countdownEl = document.getElementById("countdownTimer");

            if (countdownEl) {
                countdownEl.textContent = remaining;
            }

            countdownInterval = setInterval(() => {
                remaining--;

                if (countdownEl) {
                    countdownEl.textContent = remaining;
                }

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    console.log("⏰ 10 saniyə bitdi, lobbiyə yönləndirilir...");
                    location.href = '/FrontEnd/Games/loto-room.html';
                }
            }, 1000);
        }

        function displayWinningCard(card) {
            const grid = document.getElementById("winnerCardGrid");
            if (!grid) {
                console.error("❌ winnerCardGrid elementi tapılmadı!");
                return;
            }

            grid.innerHTML = "";

            console.log("🎴 Rendering winner card:", card);

            if (!card || !Array.isArray(card) || card.length !== 3) {
                console.error("❌ Invalid card format:", card);
                grid.innerHTML = "<p style='color: red; grid-column: 1/-1;'>Kart məlumatı yüklənmədi</p>";
                return;
            }

            const drawnSet = new Set(drawnNumbers);

            for (let r = 0; r < 3; r++) {
                if (!Array.isArray(card[r]) || card[r].length !== 9) {
                    console.error(`❌ Invalid row ${r}:`, card[r]);
                    continue;
                }

                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement("div");
                    const val = card[r][c];

                    if (val === null || val === undefined) {
                        cell.className = "winner-cell blank";
                    } else {
                        const isDrawn = drawnSet.has(val);
                        cell.className = `winner-cell ${isDrawn ? 'winning' : 'not-drawn'}`;
                        cell.textContent = val;
                    }

                    grid.appendChild(cell);
                }
            }

            console.log("✅ Winner card rendered successfully");
        }

        function startTimer(seconds) {
            stopTimer();
            let remaining = seconds;
            const timerBadge = document.getElementById("winRuleBadge");

            if (!timerBadge) return;

            timerInterval = setInterval(() => {
                remaining--;

                if (remaining <= 0) {
                    stopTimer();
                    timerBadge.textContent = winRule;
                    return;
                }

                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerBadge.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function renderTickets() {
            const container = document.getElementById("ticketsContainer");
            if (!container) return;

            container.innerHTML = "";

            myTickets.forEach((ticket, index) => {
                const ticketDiv = document.createElement("div");
                ticketDiv.className = "ticket";

                let gridHTML = '';
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 9; c++) {
                        const val = ticket.card[r][c];
                        const isMarked = val !== null && drawnNumbers.includes(val);
                        const cellClass = val === null ? 'cell blank' : `cell ${isMarked ? 'marked' : ''}`;
                        gridHTML += `<div class="${cellClass}">${val ?? ''}</div>`;
                    }
                }

                ticketDiv.innerHTML = `
                                <div class="ticket-header">
                                    <div class="ticket-number">🎫 Bilet #${index + 1}</div>
                                    <div style="display: flex; gap: 10px;">
                                        <button class="btn-refresh" onclick="refreshTicket('${ticket.ticketId}')"
                                                ${isGameStarted ? 'disabled' : ''}>
                                            🔄 Yenilə
                                        </button>
                                        <button class="btn-delete" onclick="deleteTicket('${ticket.ticketId}')"
                                                ${isGameStarted ? 'disabled' : ''}>
                                            🗑️ Sil
                                        </button>
                                        <button class="btn" onclick="callBingo('${ticket.ticketId}')"
                                                ${!isGameStarted ? 'disabled' : ''}>
                                            🎯 BINGO
                                        </button>
                                    </div>
                                </div>
                                <div class="card-grid">${gridHTML}</div>
                            `;

                container.appendChild(ticketDiv);
            });
        }

        function updateHistory() {
            const history = document.getElementById("history");
            if (!history) return;

            history.innerHTML = "";

            const last20 = drawnNumbers.slice(-20).reverse();
            last20.forEach(num => {
                const ball = document.createElement("div");
                ball.className = "history-ball";
                ball.textContent = num;
                history.appendChild(ball);
            });
        }

        function markNumber(num) {
            renderTickets();
        }

        function goToLobby() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            location.href = '/FrontEnd/Games/loto-room.html';
        }

        async function refreshTicket(ticketId) {
            try {
                await connection.invoke("RefreshTicket", ticketId);
            } catch (err) {
                console.error("Refresh error:", err);
                showNotification("❌ Yeniləmə xətası");
            }
        }

        async function deleteTicket(ticketId) {
            try {
                await connection.invoke("DeleteTicket", ticketId);
            } catch (err) {
                console.error("Delete error:", err);
                showNotification("❌ Silmə xətası");
            }
        }

        async function callBingo(ticketId) {
            try {
                await connection.invoke("Bingo", ticketId);
            } catch (err) {
                console.error("Bingo error:", err);
            }
        }

        document.getElementById("buyTicketBtn").addEventListener("click", async () => {
            try {
                const result = await connection.invoke("BuyTicket", roomId);
                if (!result.success) {
                    showNotification("❌ " + result.message);
                }
            } catch (err) {
                console.error("Buy ticket error:", err);
                showNotification("❌ Bilet almaq alınmadı");
            }
        });

        document.getElementById("backBtn").addEventListener("click", async () => {
            if (myTickets.length > 0 && !isGameStarted) {
                if (confirm("Biletləriniz silinəcək və balans qaytarılacaq. Davam edək?")) {
                    try {
                        for (const ticket of myTickets) {
                            await connection.invoke("DeleteTicket", ticket.ticketId);
                        }
                    } catch (err) {
                        console.error("Exit error:", err);
                    }
                }
            }
            location.href = '/FrontEnd/Games/loto-room.html';
        });

        async function init() {
            if (!roomId) {
                console.error("❌ RoomId yoxdur!");
                location.href = '/FrontEnd/Games/loto-room.html';
                return;
            }

            console.log("🎮 Initializing game for room:", roomId);

            try {
                connection = createConnection();

                console.log("📡 Starting SignalR connection...");
                await connection.start();
                console.log("✅ SignalR connected!");

                console.log("🚪 Joining room:", roomId);
                await connection.invoke("JoinRoomView", roomId);
                console.log("✅ Room joined!");
            } catch (err) {
                console.error("❌ Connection error:", err);
                showNotification("❌ Bağlantı xətası");
            }
        }

        init();
    </script>
</body>
</html>
