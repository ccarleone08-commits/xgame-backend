<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080b12;
            --bg-surface: #0d1117;
            --bg-elevated: #131922;
            --bg-hover: #1a2030;
            --border: #1e2636;
            --border-light: #253040;
            --accent: #4f8ef7;
            --accent-dim: #1a2d4a;
            --green: #22c55e;
            --green-dim: #0d2318;
            --yellow: #f59e0b;
            --yellow-dim: #1f1a08;
            --red: #ef4444;
            --red-dim: #200d0d;
            --purple: #a78bfa;
            --purple-dim: #1a1330;
            --text-primary: #e8edf5;
            --text-secondary: #7d8fa8;
            --text-muted: #3d4f63;
            --radius: 10px;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--sans);
            font-size: 14px;
            overflow: hidden;
        }

        button {
            font-family: var(--sans);
            cursor: pointer;
        }

        input, textarea, select {
            font-family: var(--sans);
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 4px;
        }

        /* LAYOUT */
        .app {
            display: grid;
            grid-template-rows: 52px 1fr;
            grid-template-columns: 300px 1fr;
            height: 100vh;
        }

        /* TOPBAR */
        .topbar {
            grid-column: 1 / -1;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        .topbar-sep {
            flex: 1;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px 5px 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .user-avatar {
            width: 22px;
            height: 22px;
            background: var(--accent-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--accent);
            font-weight: 700;
            font-family: var(--mono);
        }

        .hub-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-family: var(--mono);
            color: var(--text-muted);
        }

        .hub-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background .3s;
        }

            .hub-dot.connected {
                background: var(--green);
                box-shadow: 0 0 6px var(--green);
            }

            .hub-dot.error {
                background: var(--red);
            }

        /* SIDEBAR */
        .sidebar {
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-head {
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 12px;
            font-family: var(--mono);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ticket-count {
            font-size: 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 2px 7px;
            border-radius: 10px;
            font-family: var(--mono);
        }

        .btn-new {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-size: 12px;
            font-family: var(--mono);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity .15s;
            margin-top: 10px;
        }

            .btn-new:hover {
                opacity: .85;
            }

        .ticket-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .ticket-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all .15s;
            position: relative;
            background: var(--bg-elevated);
        }

            .ticket-card:hover {
                border-color: var(--border-light);
                background: var(--bg-hover);
            }

            .ticket-card.active {
                border-color: var(--accent);
                background: var(--accent-dim);
            }

                .ticket-card.active::before {
                    content: '';
                    position: absolute;
                    left: 0;
                    top: 20%;
                    bottom: 20%;
                    width: 3px;
                    background: var(--accent);
                    border-radius: 0 3px 3px 0;
                }

        .card-top {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 7px;
        }

        .tk-num {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
        }

        .badge {
            font-size: 10px;
            font-family: var(--mono);
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: .3px;
        }

        .badge-high {
            background: var(--red-dim);
            color: var(--red);
            border: 1px solid #3d1515;
        }

        .badge-medium {
            background: var(--yellow-dim);
            color: var(--yellow);
            border: 1px solid #3d2d0a;
        }

        .badge-low {
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid #0d2d18;
        }

        .badge-open {
            background: #0d1a2e;
            color: #60a5fa;
            border: 1px solid #1a3050;
        }

        .badge-claimed {
            background: var(--yellow-dim);
            color: var(--yellow);
            border: 1px solid #3d2d0a;
        }

        .badge-inprogress {
            background: var(--purple-dim);
            color: var(--purple);
            border: 1px solid #2d1a5e;
        }

        .badge-solved {
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid #0d2d18;
        }

        .badge-closed {
            background: #141414;
            color: #555;
            border: 1px solid #252525;
        }

        .card-subject {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-date {
            font-size: 10px;
            color: var(--text-muted);
            font-family: var(--mono);
        }

        .list-empty {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* MAIN */
        .main-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-base);
        }

        .panel-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
        }

            .panel-empty svg {
                opacity: .2;
            }

            .panel-empty p {
                font-size: 13px;
                font-family: var(--mono);
            }

        /* NEW TICKET FORM */
        .form-panel {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .form-title {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .form-group.full {
                grid-column: 1/-1;
            }

        .form-label {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .form-input, .form-select, .form-textarea {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border-color .2s;
            width: 100%;
        }

            .form-input:focus, .form-select:focus, .form-textarea:focus {
                border-color: var(--accent);
            }

        .form-select {
            cursor: pointer;
        }

            .form-select option {
                background: var(--bg-elevated);
            }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
            font-family: var(--sans);
            line-height: 1.5;
        }

        .btn-submit {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 11px 28px;
            border-radius: 8px;
            font-size: 13px;
            font-family: var(--mono);
            font-weight: 600;
            transition: opacity .15s;
            align-self: flex-start;
            margin-top: 4px;
        }

            .btn-submit:hover {
                opacity: .85;
            }

            .btn-submit:disabled {
                opacity: .4;
                cursor: not-allowed;
            }

        /* DETAIL */
        .detail-header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
        }

        .detail-tk-num {
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
        }

        .info-bar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .info-item {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--text-muted);
            white-space: nowrap;
        }

            .info-item strong {
                color: var(--text-secondary);
                margin-left: 4px;
                font-weight: 500;
            }

        .orig-msg {
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            flex-shrink: 0;
        }

        .orig-label {
            font-size: 10px;
            font-family: var(--mono);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .orig-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* CHAT */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-wrap {
            display: flex;
            flex-direction: column;
        }

            .msg-wrap.mine {
                align-items: flex-end;
            }

            .msg-wrap.theirs {
                align-items: flex-start;
            }

        .msg-bubble {
            max-width: 68%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px 12px 12px 3px;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.55;
            color: var(--text-primary);
            word-break: break-word;
        }

        .msg-wrap.mine .msg-bubble {
            background: var(--accent-dim);
            border-color: #1e3a6a;
            border-radius: 12px 12px 3px 12px;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .msg-sender {
            font-size: 11px;
            font-family: var(--mono);
            font-weight: 600;
            color: var(--purple);
        }

        .msg-wrap.mine .msg-sender {
            color: var(--accent);
        }

        .msg-time {
            font-size: 10px;
            font-family: var(--mono);
            color: var(--text-muted);
        }

        .chat-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
            font-family: var(--mono);
        }

        .solved-banner {
            background: var(--green-dim);
            border-top: 1px solid #1a4d2e;
            color: var(--green);
            text-align: center;
            padding: 10px;
            font-size: 12px;
            font-family: var(--mono);
            font-weight: 600;
            letter-spacing: .5px;
            flex-shrink: 0;
        }

        .chat-input-wrap {
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            padding: 14px 20px;
            flex-shrink: 0;
        }

        .chat-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #chat-input {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 13px;
            resize: none;
            outline: none;
            height: 42px;
            max-height: 100px;
            transition: border-color .2s;
            line-height: 1.5;
        }

            #chat-input:focus {
                border-color: var(--accent);
            }

        .btn-send {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity .15s, transform .1s;
        }

            .btn-send:hover {
                opacity: .85;
            }

            .btn-send:active {
                transform: scale(.95);
            }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
        }

        .toast {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 12px;
            font-family: var(--mono);
            color: var(--text-primary);
            min-width: 260px;
            max-width: 340px;
            animation: toastIn .2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,.4);
        }

            .toast.success {
                border-left-color: var(--green);
            }

            .toast.error {
                border-left-color: var(--red);
            }

            .toast.warning {
                border-left-color: var(--yellow);
            }

        @keyframes toastIn {
            from {
                transform: translateX(20px);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-brand">
                <div class="brand-dot"></div>
                SUPPORT
            </div>
            <div class="hub-status" style="margin-left:16px">
                <div class="hub-dot" id="hub-dot"></div>
                <span id="hub-label">qoşulmur...</span>
            </div>
            <div class="topbar-sep"></div>
            <div style="display:flex;align-items:center;gap:10px">
                <div class="user-chip">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <span id="nav-username">—</span>
                </div>
            </div>
        </header>

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-head">
                <div class="sidebar-title">
                    Ticketlərim
                    <span class="ticket-count" id="ticket-count">0</span>
                </div>
                <button class="btn-new" onclick="showNewForm()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    Yeni Ticket
                </button>
            </div>
            <div class="ticket-list" id="ticket-list">
                <div class="list-empty">Yüklənir...</div>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main-panel" id="main-panel">
            <div class="panel-empty">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                <p>// ticket seçin və ya yeni yaradın</p>
            </div>
        </main>

    </div>

    <div class="toast-container" id="toasts"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script>
/* ═══ CONFIG ═══ */
const BASE_URL = window.location.origin;
const HUB_URL  = `${BASE_URL}/hubs/support`;

/* ═══ AUTH ═══ */
const Auth = {
  getToken() {
    const raw = document.cookie
      .split("; ")
      .find(row => row.startsWith("AuthToken="))
      ?.split("=")[1];
    if (!raw) return "";
    let token = decodeURIComponent(raw).trim();
    if (token.endsWith(".")) token = token.slice(0, -1);
    return token;
  },
  _parseJwt() {
    const token = this.getToken();
    if (!token) return null;
    try {
      const payload = token.split(".")[1];
      return JSON.parse(atob(payload));
    } catch { return null; }
  },
  getUsername() {
    const p = this._parseJwt();
    return p?.["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"] ?? "Unknown";
  },
  getUserId() {
    const p = this._parseJwt();
    return parseInt(p?.["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier"] ?? "0");
  },
  getFullName() {
    const p = this._parseJwt();
    return p?.["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname"] ?? this.getUsername();
  },
  isLoggedIn() { return !!this.getToken(); }
};

/* ═══ API ═══ */
const Api = {
  async req(method, path, body = null) {
    const headers = { "Content-Type": "application/json" };
    const token = Auth.getToken();
    if (token) headers["Authorization"] = `Bearer ${token}`;
    const res = await fetch(`${BASE_URL}${path}`, {
      method, headers,
      body: body ? JSON.stringify(body) : null
    });
    const ct = res.headers.get("content-type") ?? "";
    const data = ct.includes("application/json") ? await res.json() : null;
    if (!res.ok) throw new Error(data?.message ?? "Xəta baş verdi");
    return data;
  },
  createTicket(dto)  { return this.req("POST", "/api/support/tickets", dto); },
  getMyTickets()     { return this.req("GET",  "/api/support/tickets/my"); },
  getTicket(id)      { return this.req("GET",  `/api/support/tickets/${id}`); },
};

/* ═══ SIGNALR ═══ */
let hubConn = null;
let currentTicketId = null;

async function connectHub() {
  if (!Auth.isLoggedIn()) return;

  hubConn = new signalR.HubConnectionBuilder()
    .withUrl(HUB_URL, {
      accessTokenFactory: () => Auth.getToken(),
      transport: signalR.HttpTransportType.WebSockets
    })
    .withAutomaticReconnect([0, 2000, 5000, 10000])
    .configureLogging(signalR.LogLevel.Warning)
    .build();

  hubConn.on("ReceiveMessage", e => {
    if (e.ticketId === currentTicketId) appendMsg(e);
  });

  hubConn.on("TicketSolved", e => {
    toast("Ticketiniz həll edildi ✓", "success");
    loadMyTickets();
    if (currentTicketId === e.ticketId) openTicket(e.ticketId);
  });

  hubConn.on("TicketClaimed", () => loadMyTickets());
  hubConn.on("Error", msg => toast(msg, "error"));

  hubConn.onreconnecting(() => setHubStatus("reconnecting"));
  hubConn.onreconnected(()  => setHubStatus("connected"));
  hubConn.onclose(()        => setHubStatus("error"));

  await hubConn.start();
  setHubStatus("connected");
}

function setHubStatus(s) {
  const dot = document.getElementById("hub-dot");
  const lbl = document.getElementById("hub-label");
  dot.className = "hub-dot";
  if (s === "connected")  { dot.classList.add("connected"); lbl.textContent = "connected"; }
  else if (s === "error") { dot.classList.add("error");     lbl.textContent = "disconnected"; }
  else                    { lbl.textContent = "reconnecting..."; }
}

async function hubInvoke(method, ...args) {
  if (!hubConn || hubConn.state !== signalR.HubConnectionState.Connected) return;
  try { await hubConn.invoke(method, ...args); }
  catch(e) { console.error(method, e); }
}

/* ═══ TICKET LIST ═══ */
async function loadMyTickets() {
  if (!Auth.isLoggedIn()) { renderEmptyList("Daxil olmamısınız"); return; }
  try {
    const tickets = await Api.getMyTickets();
    renderList(tickets);
  } catch(e) {
    renderEmptyList("Ticketlər yüklənmədi");
  }
}

function renderList(tickets) {
  const el = document.getElementById("ticket-list");
  document.getElementById("ticket-count").textContent = tickets?.length ?? 0;
  if (!tickets || tickets.length === 0) {
    el.innerHTML = `<div class="list-empty">Hələ ticket yoxdur</div>`;
    return;
  }
  el.innerHTML = tickets.map(t => `
    <div class="ticket-card ${t.id === currentTicketId ? "active" : ""}" onclick="openTicket(${t.id})">
      <div class="card-top">
        <span class="tk-num">${esc(t.ticketNumber)}</span>
        <span class="badge ${priClass(t.priority)}">${priLabel(t.priority)}</span>
        <span class="badge ${stClass(t.status)}">${stLabel(t.status)}</span>
      </div>
      <div class="card-subject">${esc(t.subject)}</div>
      <div class="card-date">${fmtDate(t.createDate)}</div>
    </div>
  `).join("");
}

function renderEmptyList(msg) {
  document.getElementById("ticket-list").innerHTML = `<div class="list-empty">${msg}</div>`;
}

        </div>

        </div>

            <option value="5">Chat</option>

      </button>

async function submitTicket() {
  const fullName = document.getElementById("f-fullname").value.trim();
  const email    = document.getElementById("f-email").value.trim();
  const category = document.getElementById("f-category").value;
  const priority = document.getElementById("f-priority").value;
  const subject  = document.getElementById("f-subject").value.trim();
  const message  = document.getElementById("f-message").value.trim();

  if (!fullName || !email || !category || !subject || !message) {
    toast("Bütün məcburi sahələri doldurun", "warning"); return;
  }

  const btn = document.getElementById("btn-submit");
  btn.disabled = true;
  btn.textContent = "Göndərilir...";

  try {
    const res = await Api.createTicket({
      fullName, email,
      category: Number(category),
      priority: Number(priority),
      subject, message
    });
    toast(`Ticket yaradıldı: ${res.ticketNumber}`, "success");
    await loadMyTickets();

    // Yeni ticket-i tap və aç
    const tickets = await Api.getMyTickets();
    const newest  = tickets[0];
    if (newest) openTicket(newest.id);
  } catch(e) {
    toast(e.message, "error");
    btn.disabled = false;
    btn.textContent = "Ticket Göndər";
  }
}

/* ═══ TICKET DETAIL ═══ */
async function openTicket(id) {
  if (currentTicketId && currentTicketId !== id)
    await hubInvoke("LeaveTicket", currentTicketId);

  currentTicketId = id;
  refreshActiveCard();

  try {
    const t = await Api.getTicket(id);
    renderDetail(t);
    await hubInvoke("JoinTicket", id);
  } catch(e) {
    toast(e.message, "error");
  }
}

function renderDetail(t) {
  const panel   = document.getElementById("main-panel");
  const isSolved = t.status === 4 || t.status === 5;
  const myUserId = Auth.getUserId();

  panel.innerHTML = `
    <div class="detail-header">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="detail-tk-num">${esc(t.ticketNumber)}</span>
        <span class="badge ${priClass(t.priority)}">${priLabel(t.priority)}</span>
        <span class="badge ${stClass(t.status)}">${stLabel(t.status)}</span>
      </div>
    </div>

    <div class="info-bar">
      <div class="info-item">Kateqoriya:<strong>${catLabel(t.category)}</strong></div>
      <div class="info-item">Tarix:<strong>${fmtDate(t.createDate)}</strong></div>
      ${t.assignedWorkerName
        ? `<div class="info-item">Worker:<strong style="color:var(--purple)">${esc(t.assignedWorkerName)}</strong></div>`
        : `<div class="info-item" style="color:var(--yellow)">⏳ Cavab gözlənilir...</div>`}
      ${t.solvedAt
        ? `<div class="info-item">Həll:<strong style="color:var(--green)">${fmtDate(t.solvedAt)}</strong></div>`
        : ""}
    </div>

    <div class="orig-msg">
      <div class="orig-label">// ilk mesajınız</div>
      <div class="orig-text">${esc(t.message)}</div>
    </div>

    <div class="chat-area" id="chat-area">
      ${t.messages && t.messages.length > 0
        ? t.messages.map(m => msgHTML(m, myUserId)).join("")
        : `<div class="chat-empty">// mesaj yoxdur</div>`}
    </div>

    ${isSolved
      ? `<div class="solved-banner">✓ TICKET HƏll EDİLDİ — ${t.solvedAt ? fmtDate(t.solvedAt) : ""}</div>`
      : `<div class="chat-input-wrap">
           <div class="chat-row">
             <textarea id="chat-input" placeholder="Mesajınızı yazın... (Enter = göndər)"></textarea>
             <button class="btn-send" onclick="sendMsg()">
               <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                 <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
               </svg>
             </button>
           </div>
         </div>`}
  `;

  scrollChat();
  bindInput();
}

/* ═══ CHAT ═══ */
async function sendMsg() {
  if (!currentTicketId) return;
  const input   = document.getElementById("chat-input");
  const content = input?.value.trim();
  if (!content) return;
  await hubInvoke("SendMessage", currentTicketId, content, false);
  if (input) input.value = "";
}

function bindInput() {
  const input = document.getElementById("chat-input");
  if (!input) return;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "42px";
    input.style.height = Math.min(input.scrollHeight, 100) + "px";
  });
}

function appendMsg(e) {
  const area = document.getElementById("chat-area");
  if (!area) return;
  const empty = area.querySelector(".chat-empty");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.innerHTML = msgHTML({
    id: e.messageId, senderId: e.senderId, senderName: e.senderName,
    content: e.content, sentAt: e.sentAt, isInternal: false
  }, Auth.getUserId());
  area.appendChild(div.firstElementChild);
  scrollChat();
}

function scrollChat() {
  const a = document.getElementById("chat-area");
  if (a) a.scrollTop = a.scrollHeight;
}

/* ═══ HTML HELPERS ═══ */
function msgHTML(m, myUserId) {
  const isMine = Number(m.senderId) === Number(myUserId);
  return `
    <div class="msg-wrap ${isMine ? "mine" : "theirs"}">
      <div class="msg-meta">
        <span class="msg-sender">${esc(m.senderName)}</span>
        <span class="msg-time">${fmtTime(m.sentAt)}</span>
      </div>
      <div class="msg-bubble">${esc(m.content)}</div>
    </div>`;
}

function priClass(p) { return {1:"badge-low",2:"badge-medium",3:"badge-high"}[p] ?? "badge-low"; }
function priLabel(p) { return {1:"LOW",2:"MED",3:"HIGH"}[p] ?? "—"; }
function stClass(s)  { return {1:"badge-open",2:"badge-claimed",3:"badge-inprogress",4:"badge-solved",5:"badge-closed"}[s] ?? ""; }
function stLabel(s)  { return {1:"AÇIQ",2:"GÖTÜRÜLMÜŞ",3:"DAVAM EDİR",4:"HƏll EDİLMİŞ",5:"BAĞLI"}[s] ?? "—"; }
function catLabel(c) {
  return {1:"Payments",2:"Gameplay",3:"Profile",4:"Authentication",5:"Chat",
    6:"Connection",7:"Wallet",8:"Ranking",9:"Notifications",10:"Mobile",
    11:"Bonuses",12:"Settings",13:"Audio",14:"Other"}[c] ?? "—";
}
function fmtDate(d) {
  if (!d) return "—";
  return new Date(d).toLocaleDateString("az-AZ", {day:"2-digit",month:"2-digit",year:"numeric"});
}
function fmtTime(d) {
  if (!d) return "";
  return new Date(d).toLocaleTimeString("az-AZ", {hour:"2-digit",minute:"2-digit"});
}
function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function refreshActiveCard() {
  document.querySelectorAll(".ticket-card").forEach(c => {
    const id = parseInt(c.getAttribute("onclick")?.match(/\d+/)?.[0]);
    c.classList.toggle("active", id === currentTicketId);
  });
}

/* ═══ TOAST ═══ */
function toast(msg, type = "info") {
  const container = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

/* ═══ INIT ═══ */
document.addEventListener("DOMContentLoaded", async () => {
  const username = Auth.getUsername();
  document.getElementById("nav-username").textContent = username;
  document.getElementById("user-avatar").textContent  = username[0]?.toUpperCase() ?? "?";

  try {
    await connectHub();
  } catch(e) {
    setHubStatus("error");
  }

  if (Auth.isLoggedIn()) {
    await loadMyTickets();
  } else {
    // Login olmadan da ticket yarada bilər
    renderEmptyList("Ticketləri görmək üçün daxil olun");
    showNewForm();
  }
});
