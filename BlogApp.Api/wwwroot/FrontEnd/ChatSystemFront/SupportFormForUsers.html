<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dəstək - Support Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

            .form-header h1 {
                font-size: 32px;
                margin-bottom: 10px;
            }

            .form-header p {
                font-size: 15px;
                opacity: 0.9;
            }

        .form-body {
            padding: 40px 30px;
        }

        .user-info-section {
            background: #f0f4f8;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #667eea;
        }

        .user-info-row {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }

            .user-info-row:last-child {
                margin-bottom: 0;
            }

        .user-info-item {
            flex: 1;
        }

        .user-info-label {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .user-info-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 25px;
        }

            .form-group label {
                display: block;
                font-weight: 600;
                color: #333;
                margin-bottom: 8px;
                font-size: 14px;
            }

            .form-group input,
            .form-group textarea {
                width: 100%;
                padding: 12px 15px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-family: inherit;
                font-size: 14px;
                transition: all 0.3s ease;
                resize: none;
            }

                .form-group input:focus,
                .form-group textarea:focus {
                    outline: none;
                    border-color: #667eea;
                    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
                }

            .form-group textarea {
                min-height: 120px;
                font-family: 'Segoe UI', sans-serif;
            }

        .error-message {
            display: none;
            background: #fee;
            color: #c33;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            border-left: 4px solid #c33;
            animation: shakeX 0.3s ease-in-out;
        }

            .error-message.show {
                display: block;
            }

        @keyframes shakeX {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

            .btn:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            }

            .btn:active:not(:disabled) {
                transform: translateY(0);
            }

            .btn:disabled {
                opacity: 0.7;
                cursor: not-allowed;
                transform: none;
            }

        .btn-loading {
            pointer-events: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Success State */
        .success-state {
            display: none;
            text-align: center;
            padding: 60px 30px;
        }

            .success-state.show {
                display: block;
                animation: slideUp 0.5s ease-out;
            }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .success-state h2 {
            color: #28a745;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .success-state p {
            color: #666;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .ticket-id {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
            color: #28a745;
            font-size: 18px;
        }

        .reset-btn {
            margin-top: 20px;
            background: #667eea;
        }

        .no-auth-message {
            background: #fff3cd;
            color: #856404;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #ffeaa7;
        }

        @media (max-width: 600px) {
            .form-header {
                padding: 30px 20px;
            }

                .form-header h1 {
                    font-size: 24px;
                }

            .form-body {
                padding: 30px 20px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .user-info-row {
                flex-direction: column;
                gap: 0;
            }

                .user-info-row .user-info-item {
                    margin-bottom: 10px;
                }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>📞 Dəstək</h1>
                <p>Sizin üçün fərdi dəstək 24/7! ⭐</p>
            </div>

            <div class="form-body">
                <!-- No Auth Message -->
                <div class="no-auth-message" id="noAuthMessage" style="display: none;">
                    ⚠️ Müraciət göndərmək üçün <a href="/login" style="color: #856404; font-weight: 600;">giriş edin</a>
                </div>

                <!-- Form -->
                <form id="supportForm">
                    <div class="error-message" id="errorMessage"></div>

                    <!-- User Info Section -->
                    <div class="user-info-section" id="userInfoSection" style="display: none;">
                        <div class="user-info-row">
                            <div class="user-info-item">
                                <div class="user-info-label">Ad Soyad</div>
                                <div class="user-info-value" id="displayName">-</div>
                            </div>
                            <div class="user-info-item">
                                <div class="user-info-label">Email</div>
                                <div class="user-info-value" id="displayEmail">-</div>
                            </div>
                        </div>
                    </div>

                    <!-- Subject Field -->
                    <div class="form-group">
                        <label for="subject">Mövzu *</label>
                        <input type="text"
                               id="subject"
                               name="subject"
                               placeholder="Məsələn: Oyun donur, ödəniş problemi"
                               required>
                    </div>

                    <!-- Message Field -->
                    <div class="form-group">
                        <label for="message">Mesaj *</label>
                        <textarea id="message"
                                  name="message"
                                  placeholder="Məsələnizi ətraflı şəkildə təsvir edin..."
                                  required></textarea>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">
                        <span>📤 Göndər</span>
                    </button>
                </form>

                <!-- Success State -->
                <div class="success-state" id="successState">
                    <div class="success-icon">✅</div>
                    <h2>Müraciət qəbul edildi!</h2>
                    <p>Sizə tezliklə cavab veriləcəkdir</p>
                    <div class="ticket-id" id="ticketIdDisplay"></div>
                    <button type="button" class="btn reset-btn" onclick="resetForm()">
                        Yeni müraciət
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api/support';
        const form = document.getElementById('supportForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMessage');
        const successState = document.getElementById('successState');
        const userInfoSection = document.getElementById('userInfoSection');
        const noAuthMessage = document.getElementById('noAuthMessage');

        // Token-i cookie-dən oxu
        function getToken() {
            const raw = document.cookie
                .split("; ")
                .find(row => row.startsWith("AuthToken="))
                ?.split("=")[1];
            if (!raw) return "";
            let token = decodeURIComponent(raw).trim();
            if (token.endsWith(".")) token = token.slice(0, -1);
            return token;
        }

        // JWT-i decode et
        function decodeJWT(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (error) {
                console.error("JWT decode xətası:", error);
                return null;
            }
        }

        // Səhifə açılarkən istifadəçi məlumatlarını yüklə
        document.addEventListener('DOMContentLoaded', () => {
            const token = getToken();

            if (!token) {
                noAuthMessage.style.display = 'block';
                form.style.display = 'none';
                return;
            }

            // Token-dən user məlumatlarını çıxar
            const decoded = decodeJWT(token);
            if (!decoded) {
                noAuthMessage.style.display = 'block';
                form.style.display = 'none';
                return;
            }

            // Cookie-dən məlumatı göstər
            const fullName = decoded['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name'];
            const email = decoded['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress'];
            const userId = decoded['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier'];

            if (fullName && email && userId) {
                document.getElementById('displayName').textContent = fullName;
                document.getElementById('displayEmail').textContent = email;
                userInfoSection.style.display = 'block';
                form.style.display = 'block';
                noAuthMessage.style.display = 'none';

                // Global user məlumatları
                window.currentUser = {
                    id: userId,
                    fullName: fullName,
                    email: email
                };

                console.log("✅ User məlumatları yükləndi:", window.currentUser);
            } else {
                noAuthMessage.style.display = 'block';
                form.style.display = 'none';
            }
        });

        // Form göndərmə
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');

            if (!validateForm()) return;

            const formData = {
                subject: document.getElementById('subject').value.trim(),
                message: document.getElementById('message').value.trim()
            };

            await sendSupport(formData);
        });

        // Form validasiyası
        function validateForm() {
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!subject) {
                showError('Mövzunu daxil edin');
                return false;
            }

            if (!message || message.length < 10) {
                showError('Mesaj ən azı 10 simvol olmalıdır');
                return false;
            }

            return true;
        }

        // Support müraciətini göndər
        async function sendSupport(data) {
            submitBtn.disabled = true;
            submitBtn.classList.add('btn-loading');
            submitBtn.innerHTML = '<div class="spinner"></div> Göndərilir...';

            try {
                const url = new URL(API_BASE_URL);
                url.searchParams.append('id', window.currentUser.id);

                console.log("📤 Request göndəriliyor:");
                console.log("URL:", url.toString());
                console.log("Data:", data);

                const response = await fetch(url.toString(), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });

                console.log("📥 Response alındı:");
                console.log("Status:", response.status);
                console.log("Headers:", response.headers);

                const responseData = await response.json();
                console.log("Response Data:", responseData);

                if (!response.ok) {
                    throw new Error(responseData.message || `HTTP ${response.status}`);
                }

                const result = responseData;

                form.reset();
                document.getElementById('ticketIdDisplay').textContent = `Ticket ID: #${result.ticketId}`;

                form.style.display = 'none';
                userInfoSection.style.display = 'none';
                successState.classList.add('show');

                setTimeout(() => {
                    resetForm();
                }, 5000);

            } catch (error) {
                console.error('❌ Xəta:', error);
                showError(error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('btn-loading');
                submitBtn.innerHTML = '<span>📤 Göndər</span>';
            }
        }

        function showError(message) {
            errorMsg.textContent = '❌ ' + message;
            errorMsg.classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            form.reset();
            form.style.display = 'block';
            userInfoSection.style.display = 'block';
            successState.classList.remove('show');
            errorMsg.classList.remove('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('message').addEventListener('input', function () {
            if (this.value.length < 10 && this.value.length > 0) {
                this.style.borderColor = '#ffc107';
            } else {
                this.style.borderColor = '#e0e0e0';
            }
        });
    </script>
</body>
</html>
