<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seka Oyunu - Premium Casino</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
            min-height: 100vh;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at 20% 50%, rgba(74, 222, 128, 0.03) 0%, transparent 50%);
                pointer-events: none;
                z-index: 0;
            }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

            .header h1 {
                font-size: 3rem;
                background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 10px;
            }

        .header-subtitle {
            color: #4ade80;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .balance {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .quick-join-section {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .quick-join-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .quick-join-btn {
            padding: 25px 15px;
            background: linear-gradient(145deg, rgba(74, 222, 128, 0.2), rgba(34, 197, 94, 0.2));
            border: 2px solid #4ade80;
            border-radius: 15px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

            .quick-join-btn:hover {
                background: linear-gradient(145deg, rgba(74, 222, 128, 0.4), rgba(34, 197, 94, 0.4));
                transform: translateY(-5px);
                box-shadow: 0 10px 30px rgba(74, 222, 128, 0.4);
            }

            .quick-join-btn .name {
                font-size: 1.2rem;
                margin-bottom: 10px;
            }

            .quick-join-btn .fee {
                font-size: 2rem;
                color: #ffd700;
                display: block;
                margin-bottom: 8px;
            }

            .quick-join-btn .players {
                font-size: 0.85rem;
                color: #94a3b8;
                margin-top: 5px;
            }

            .quick-join-btn .limit-type {
                font-size: 0.75rem;
                color: #fbbf24;
                margin-top: 8px;
                padding: 4px 8px;
                background: rgba(251, 191, 36, 0.2);
                border-radius: 5px;
                display: inline-block;
            }

        .room-list-section {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .room-card {
            background: linear-gradient(145deg, rgba(45, 90, 143, 0.4), rgba(30, 60, 114, 0.4));
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

            .room-card:hover {
                transform: translateY(-5px);
                border-color: #4ade80;
                box-shadow: 0 15px 40px rgba(74, 222, 128, 0.3);
            }

            .room-card.full {
                opacity: 0.6;
                cursor: not-allowed;
            }

            .room-card h3 {
                color: #ffd700;
                margin-bottom: 15px;
                font-size: 1.3rem;
            }

        .room-info {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

            .room-info:last-of-type {
                border-bottom: none;
            }

        .limit-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #8b5cf6;
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

            .limit-badge.no-limit {
                background: #f59e0b;
            }

        .join-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }

            .join-btn:hover:not(:disabled) {
                background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
                transform: translateY(-2px);
            }

            .join-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .default-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffd700;
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .game-section {
            display: none;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 30px;
        }

            .game-section.active {
                display: block;
            }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .room-limit-info {
            background: rgba(139, 92, 246, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #8b5cf6;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

            .room-limit-info.no-limit {
                background: rgba(245, 158, 11, 0.2);
                border-color: #f59e0b;
            }

        .poker-table {
            background: linear-gradient(145deg, #0f5132, #1e7e34);
            border: 20px solid #8b4513;
            border-radius: 50%;
            width: 90%;
            max-width: 900px;
            aspect-ratio: 1.5;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }

        .table-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .pot-amount {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }

        .current-bet {
            font-size: 1.2rem;
            color: #fff;
        }

        /* ✅ YENİ - Player Spot (İkon + Kartlar yan-yana) */
        .player-spot {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 15px;
        }

            .player-spot.bottom {
                bottom: -100px;
                left: 50%;
                transform: translateX(-50%);
            }

            .player-spot.left {
                left: -140px;
                top: 50%;
                transform: translateY(-50%);
                flex-direction: row;
            }

            .player-spot.top-left {
                top: 5%;
                left: 10%;
            }

            .player-spot.top {
                top: -100px;
                left: 50%;
                transform: translateX(-50%);
            }

            .player-spot.top-right {
                top: 5%;
                right: 10%;
                flex-direction: row-reverse;
            }

            .player-spot.right {
                right: -140px;
                top: 50%;
                transform: translateY(-50%);
                flex-direction: row-reverse;
            }

        /* ✅ Player Info Container (İkon + Ad + Balans) */
        .player-info-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* ✅ Player Avatar */
        .player-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #4ade80, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border: 4px solid #ffd700;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            overflow: hidden; /* ✅ Şəklin kəsilməsi üçün */
        }

            .player-avatar:hover {
                transform: scale(1.1);
            }

            .player-avatar.active {
                box-shadow: 0 0 20px #ffd700;
                animation: pulse 1.5s infinite;
            }

            .player-avatar.folded {
                opacity: 0.3;
                filter: grayscale(100%);
            }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 20px #ffd700;
            }

            50% {
                box-shadow: 0 0 40px #ffd700;
            }
        }

        /* ✅ Timer Badge (İkonun sağ üst küncündə) */
        .timer-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 32px;
            height: 32px;
            background: #3b82f6;
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            z-index: 10;
            transition: all 0.3s;
        }

            .timer-badge.warning {
                background: #ef4444;
                animation: pulse-timer 0.5s infinite;
            }

        @keyframes pulse-timer {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        /* ✅ Player Cards Container */
        .player-cards-container {
            display: flex;
            gap: 8px;
        }

        .player-card-mini {
            width: 50px;
            height: 70px;
            background: #fff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }

            .player-card-mini:hover {
                transform: translateY(-5px) scale(1.05);
            }

            .player-card-mini.hearts, .player-card-mini.diamonds {
                color: #dc2626;
            }

            .player-card-mini.spades, .player-card-mini.clubs {
                color: #000;
            }

            .player-card-mini .rank {
                font-size: 1.2rem;
            }

            .player-card-mini .suit {
                font-size: 1.5rem;
            }

        /* ✅ Emoji Popup */
        .emoji-popup {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            z-index: 100;
            border: 2px solid #4ade80;
        }

            .emoji-popup.active {
                display: block;
            }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .emoji-btn {
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

            .emoji-btn:hover {
                background: rgba(255,255,255,0.3);
                transform: scale(1.2);
            }

        .floating-emoji {
            position: absolute;
            font-size: 2rem;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 200;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        .player-name {
            font-weight: bold;
            margin-top: 8px;
            font-size: 0.9rem;
            text-align: center;
        }

        .player-bet {
            color: #ffd700;
            font-size: 0.85rem;
            margin-top: 4px;
            background: rgba(255, 215, 0, 0.14);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 999px;
            padding: 4px 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .player-contribution {
            color: #8be9fd;
            font-size: 0.78rem;
            margin-top: 4px;
            background: rgba(139, 233, 253, 0.12);
            border: 1px solid rgba(139, 233, 253, 0.28);
            border-radius: 999px;
            padding: 3px 9px;
            white-space: nowrap;
        }

        /* ✅ Əl Kartları (Aşağıda böyük kartlar) */
        .hand-cards {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
        }

        .card {
            width: 110px;
            height: 154px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }

            .card:hover {
                transform: translateY(-20px) scale(1.1);
            }

            .card.hearts, .card.diamonds {
                color: #dc2626;
            }

            .card.spades, .card.clubs {
                color: #000;
            }

        .card-rank {
            font-size: 2.5rem;
        }

        .card-suit {
            font-size: 3rem;
        }

        /* ✅ Action Buttons */
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .btn-fold {
            background: #dc2626;
            color: #fff;
        }

            .btn-fold:hover:not(:disabled) {
                background: #b91c1c;
            }

        .btn-call {
            background: #3b82f6;
            color: #fff;
        }

            .btn-call:hover:not(:disabled) {
                background: #2563eb;
            }

        .btn-raise {
            background: #fbbf24;
            color: #000;
        }

            .btn-raise:hover:not(:disabled) {
                background: #f59e0b;
            }

        .btn-showdown-call {
            background: #8b5cf6;
            color: #fff;
            position: relative;
        }

            .btn-showdown-call:hover:not(:disabled) {
                background: #7c3aed;
            }

        .btn-leave {
            background: #6b7280;
            color: #fff;
        }

            .btn-leave:hover:not(:disabled) {
                background: #4b5563;
            }

        .hand-pause-panel {
            width: min(520px, 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #fbbf24;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        .hand-pause-info {
            min-width: 0;
            color: #fff;
            font-weight: 700;
        }

        .hand-pause-info span {
            color: #fbbf24;
        }

        .hand-pause-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-continue {
            background: #22c55e;
            color: #fff;
        }

            .btn-continue:hover:not(:disabled) {
                background: #16a34a;
            }

        .btn-timeout {
            background: #ef4444;
            color: #fff;
        }

            .btn-timeout:hover:not(:disabled) {
                background: #dc2626;
            }

        /* ✅ Raise Slider Container */
        .raise-slider-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #4ade80;
            min-width: 300px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .slider-label {
            color: #4ade80;
            font-weight: bold;
            font-size: 1rem;
        }

        .slider-value {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .raise-slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            outline: none;
            -webkit-appearance: none;
        }

            .raise-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 25px;
                height: 25px;
                border-radius: 50%;
                background: #ffd700;
                cursor: pointer;
                box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
                transition: all 0.3s;
            }

                .raise-slider::-webkit-slider-thumb:hover {
                    transform: scale(1.2);
                    box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
                }

            .raise-slider::-moz-range-thumb {
                width: 25px;
                height: 25px;
                border-radius: 50%;
                background: #ffd700;
                cursor: pointer;
                border: none;
                box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
                transition: all 0.3s;
            }

                .raise-slider::-moz-range-thumb:hover {
                    transform: scale(1.2);
                    box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
                }

        .slider-limits {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .players-list {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

            .players-list h3 {
                color: #ffd700;
                margin-bottom: 15px;
            }

        .player-item {
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 30px;
            border-radius: 12px;
            font-weight: bold;
            z-index: 1000;
            animation: slideInRight 0.4s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 2px solid;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .message.success {
            background: rgba(34, 197, 94, 0.95);
            color: #fff;
            border-color: #22c55e;
        }

        .message.error {
            background: rgba(220, 38, 38, 0.95);
            color: #fff;
            border-color: #dc2626;
        }

        .message.info {
            background: rgba(59, 130, 246, 0.95);
            color: #fff;
            border-color: #3b82f6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.5rem;
        }

        .spinner {
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #ffd700;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .quick-raise-btn {
            padding: 10px 5px;
            background: rgba(251, 191, 36, 0.2);
            border: 2px solid #fbbf24;
            border-radius: 8px;
            color: #ffd700;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

            .quick-raise-btn:hover:not(:disabled) {
                background: rgba(251, 191, 36, 0.5);
                transform: scale(1.05);
            }

            .quick-raise-btn.selected {
                background: #fbbf24;
                color: #000;
                box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
            }

            .quick-raise-btn:disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .showdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

            .showdown-overlay.active {
                display: flex;
            }

        .showdown-content {
            background: linear-gradient(145deg, #1e3c72, #2a5298);
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .showdown-title {
            text-align: center;
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 30px;
        }

        .showdown-players {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .showdown-player {

<body>
    <div class="container">

        <!-- QUICK JOIN SECTION -->
        <!--<div class="quick-join-section">

            <p style="color: #94a3b8; margin-bottom: 20px;">Giriş haqqı və limit növü seçin və avtomatik uyğun otağa qoşulun!</p>

        <!-- GAME SECTION -->

                    <h2>Otaq: <span id="currentRoomName">-</span></h2>

                </div>

            <!-- POKER TABLE -->
            <div class="poker-table" id="pokerTable">

            <!-- HAND CARDS -->
            <div class="hand-cards" id="handCards"></div>
            <div style="text-align: center; margin-top: 20px;">
                <div id="handScore" style="
                    display: none;
                    font-size: 1.5rem;
                    color: #ffd700;
                    font-weight: bold;

            <!-- ACTIONS -->
            <div class="actions">

                        <input type="number"
                               id="raiseInput"
                               style="flex: 1; padding: 10px; background: rgba(255,255,255,0.1);
                      border: 2px solid #4ade80; border-radius: 8px; color: #fff;
                      font-size: 1.1rem; font-weight: bold; text-align: center;"
                               min="0" max="99999" step="0.01" value="0">
                        <span style="color: #ffd700; font-weight: bold; font-size: 1.2rem;">₼</span>

                    <div class="slider-limits">

                </button>

                <button class="btn btn-leave" id="leaveBtn">Çıx</button>

                    <div class="hand-pause-actions">

    <!-- ROOM TIMER BADGE -->
    <div class="room-timer-badge hidden" id="roomTimerBadge">
        🕐 <span id="roomTimerValue">120</span>s
    </div>

    <!-- REDIRECT OVERLAY -->
    <div class="redirect-overlay" id="redirectOverlay">
        <div class="redirect-content">
            <h2>🔄 Yönləndirmə</h2>
            <p id="redirectMessage" style="color: #fff; font-size: 1.2rem;"></p>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- SHOWDOWN OVERLAY -->
    <!--<div class="showdown-overlay" id="showdownOverlay">
        <div class="showdown-content">
            <div class="showdown-title">🎴 SHOWDOWN 🎴</div>
            <div class="showdown-players" id="showdownPlayers"></div>
            <div class="showdown-winner-announce" id="showdownWinner"></div>
            <button class="showdown-close-btn" onclick="closeShowdown()">Davam et</button>
        </div>
    </div>-->
    <script>
        let connection = null;
        let currentUserId = 0;
        let currentRoomId = null;
        let myHand = [];
        let currentTurnUserId = 0;
        let currentGameBet = 0;
        let myCurrentBet = 0;
        let myBalance = 0;
        let potAmount = 0;
        let roomLimitType = 'PotLimit';
        let maxRaiseAmount = 0;
        let lastRaiserId = 0;
        let raiseCount = 0;
        let currentTimer = null;
        let turnTimeRemaining = 0;
        let roomEntryFee = 0;
        let pendingBets = {};
        let isInSvara = false;
        let svaraRound = 0;
        let nextCallAmount = 0;
        let foldedPlayerIds = new Set();
        let minRaiseAmount = 0;  
        let currentHandPauseSessionId = null;
        let handPauseDecisionSending = false;

        function resolveCallAmount(gameState) {
            if (!gameState) return 0;

            if (typeof gameState.callAmount === 'number' &&
                !Number.isNaN(gameState.callAmount) &&
                gameState.callAmount >= 0) {
                return Math.round(gameState.callAmount * 100) / 100;
            }

            if (typeof gameState.currentBet === 'number' && typeof gameState.myCurrentBet === 'number') {
                const diff = gameState.currentBet - gameState.myCurrentBet;
                if (diff > 0) {
                    return Math.round(diff * 100) / 100;
                }

                if (gameState.currentBet === 0 &&
                    gameState.myCurrentBet === 0 &&
                    gameState.canCall === true) {
                    return Math.round(roomEntryFee * 100) / 100;
                }
            }

            return 0;
        }

        function updateActionButtons(gameState) {
            if (!gameState) return;

            const isTurn = (gameState.currentTurnUserId === currentUserId);
            const canFold = gameState.canFold === true && isTurn;
            const canCall = gameState.canCall === true && isTurn;
            const canRaise = gameState.canRaise === true && isTurn;
            const resolvedCallAmount = resolveCallAmount(gameState);
            const canAllIn = isTurn && resolvedCallAmount > 0 && myBalance < resolvedCallAmount;

            // ============ FOLD ============
            const foldBtn = document.getElementById('foldBtn');
            if (foldBtn) {
                foldBtn.disabled = !canFold;
                foldBtn.style.opacity = canFold ? '1' : '0.5';
            }

            // ============ CALL ============
            const callBtn = document.getElementById('callBtn');
            if (callBtn) {
                callBtn.disabled = !canCall;
                callBtn.style.opacity = canCall ? '1' : '0.5';
                callBtn.innerHTML = `📞 CALL (${resolvedCallAmount.toFixed(2)}₼)`;
            }

            // ============ RAISE ============
            const raiseBtn = document.getElementById('raiseBtn');
            const raiseInput = document.getElementById('raiseInput');
            if (raiseBtn && raiseInput) {
                raiseBtn.disabled = !canRaise;
                raiseInput.disabled = !canRaise;
                document.querySelectorAll('.quick-raise-btn').forEach(btn => {
                    btn.disabled = !canRaise;
                });

                const minVal = getDisplayedRaiseMin();
                const maxVal = getDisplayedRaiseMax();

                raiseInput.value = minVal.toFixed(2);
                document.getElementById('raiseValue').textContent = `${minVal.toFixed(2)} ₼`;

                document.getElementById('sliderMin').textContent = `Min raise: ${minVal.toFixed(2)}₼`;
                document.getElementById('sliderMax').textContent = `Max raise: ${maxVal.toFixed(2)}₼`;
            }

            // ============ ALL-IN ============
            const allInBtn = document.getElementById('allInBtn');
            if (allInBtn) {
                allInBtn.disabled = !canAllIn;
                allInBtn.style.opacity = canAllIn ? '1' : '0.5';
            }

            // ============ SHOWDOWN CALL ============
            const showdownCallBtn = document.getElementById('showdownCallBtn');
            if (showdownCallBtn) {
                // ✅ Həm backend flag-i HƏM də növbənin mənim olduğunu yoxla
                const isShowdownEnabled = gameState.canShowdownCall === true && isTurn;
                const showdownAmount = (typeof gameState.showdownCallAmount === 'number' && !Number.isNaN(gameState.showdownCallAmount))
                    ? Math.round(gameState.showdownCallAmount * 100) / 100
                    : resolvedCallAmount;

                showdownCallBtn.disabled = !isShowdownEnabled;
                showdownCallBtn.style.opacity = isShowdownEnabled ? '1' : '0.5';

                showdownCallBtn.innerHTML = showdownAmount > 0
                    ? `Showdown Call (${showdownAmount.toFixed(2)}₼) 🎴`
                    : `Showdown Call 🎴`;
                showdownCallBtn.dataset.amount = showdownAmount.toFixed(2);

                if (isShowdownEnabled) {
                    showdownCallBtn.classList.add('golden-glow');
                } else {
                    showdownCallBtn.classList.remove('golden-glow');
                }
            }

            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log(`🔴 FOLD: ${canFold ? '✅' : '❌'}`);
            console.log(`📞 CALL (${resolvedCallAmount.toFixed(2)}₼): ${canCall ? '✅' : '❌'}`);
            console.log(`📈 RAISE MƏBLƏĞİ (min:${(minRaiseAmount > 0 ? minRaiseAmount : roomEntryFee).toFixed(2)}₼): ${canRaise ? '✅' : '❌'}`);
            console.log(`🔥 ALL-IN: ${canAllIn ? '✅' : '❌'}`);
            console.log(`⭐ SHOWDOWN: ${gameState.canShowdownCall ? '✅' : '❌'}`);
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        }
        // ==================== INIT ====================
        window.addEventListener('load', async () => {
            setupEventListeners();
            await initializeSignalR();
        });
        function setupEventListeners() {
            ['foldBtn', 'callBtn', 'allInBtn', 'raiseBtn', 'showdownCallBtn', 'leaveBtn'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    const handlers = {
                        'foldBtn': fold,
                        'callBtn': call,
                        'allInBtn': allIn,
                        'raiseBtn': raise,
                        'showdownCallBtn': showdownCall,
                        'leaveBtn': leaveRoom
                    };
                    if (handlers[id]) btn.addEventListener('click', handlers[id]);
                }
            });

            const handPauseContinueBtn = document.getElementById('handPauseContinueBtn');
            if (handPauseContinueBtn) {
                handPauseContinueBtn.addEventListener('click', () => sendHandPauseDecision(true));
            }

            const handPauseTimeoutBtn = document.getElementById('handPauseTimeoutBtn');
            if (handPauseTimeoutBtn) {
                handPauseTimeoutBtn.addEventListener('click', () => sendHandPauseDecision(false));
            }

            const slider = document.getElementById('raiseSlider');
            if (slider) {
                slider.addEventListener('input', function () {
                    const value = parseFloat(this.value).toFixed(2);
                    const raiseValue = document.getElementById('raiseValue');
                    if (raiseValue) {
                        raiseValue.textContent = value + ' ₼';
                    }
                    console.log('🎚️ Slider changed:', value);
                });
            }
        }

        function getDisplayedRaiseMin() {
            return minRaiseAmount > 0 ? minRaiseAmount : roomEntryFee;
        }

        function getDisplayedRaiseMax() {
            return maxRaiseAmount > 0 ? maxRaiseAmount : roomEntryFee * 100;
        }


        // ==================== SIGNALR CONNECTION ====================
        async function initializeSignalR() {
            try {
                console.log('🔌 SignalR başlanğıc...');

                connection = new signalR.HubConnectionBuilder()
                    .withUrl("/sekaHub", { accessTokenFactory: () => getToken() })
                    .withAutomaticReconnect()
                    .build();

                setupSignalRHandlers();

                // ✅ START ET VƏ GÖZLƏ
                await connection.start();
                console.log("✅ SignalR connected");

                // ✅ SONRA ROOM LİST YÜK LƏ
                await new Promise(resolve => setTimeout(resolve, 500)); // 500ms gözlə
                await loadRoomList();
                console.log('✅ Room list loaded');

            } catch (error) {
                console.error("❌ SignalR error:", error);
                showMessage("Bağlantı xətası: " + error.message, "error");

                // ✅ YENİDƏN CƏHD ET
                setTimeout(() => initializeSignalR(), 3000);
            }
        }
        function setupSignalRHandlers() {
            if (!connection) {
                console.error("❌ Connection is null!");
                return;
            }

            console.log('📡 Setting up SignalR handlers...');

            connection.on("UserData", (data) => {
                currentUserId = data.userId;
                myBalance = data.balance;
                const userNameEl = document.getElementById('userName');
                const userBalanceEl = document.getElementById('userBalance');
                if (userNameEl) userNameEl.textContent = data.fullName;
                if (userBalanceEl) userBalanceEl.textContent = data.balance.toFixed(2);
                console.log('✅ UserData received:', data);
            });

            connection.on("BalanceUpdated", (balance) => {
                myBalance = balance;
                const userBalanceEl = document.getElementById('userBalance');
                if (userBalanceEl) userBalanceEl.textContent = balance.toFixed(2);
            });

            connection.on("ShowCardsOnTable", (players) => {
                console.log('🎴 Showing cards on table:', players);
                showCardsOnTable(players);
            });

            connection.on("WinnerAnnounced", (data) => {
                console.log('🏆 Winner announced:', data);
                highlightWinner(data.winnerUserId);
                showWinnerBanner(data);
                setTimeout(() => clearWinnerDisplay(), 5000);
            });

            connection.on("GameReset", () => {
                try {
                    resetGameUI();
                    clearWinnerDisplay();
                    hideHandPausePanel();
                    currentHandPauseSessionId = null;
                    handPauseDecisionSending = false;

                    // ✅ Reset zamanı showdown söndür
                    const scBtn = document.getElementById('showdownCallBtn');
                    if (scBtn) {
                        scBtn.disabled = true;
                        scBtn.style.opacity = '0.5';
                        scBtn.classList.remove('golden-glow');
                    }

                    console.log('✅ GameReset tamamlandı');
                } catch (e) {
                    console.error('❌ GameReset xətası:', e);
                }
            });

            connection.on("JoinedRoom", (data) => {
                currentRoomId = data.roomId;
                roomLimitType = data.limitType || 'PotLimit';
                roomEntryFee = data.entryFee || 0;

                console.log('✅ Joined room:', {
                    roomId: data.roomId,
                    entryFee: roomEntryFee,
                    limitType: roomLimitType
                });

                const roomNameEl = document.getElementById('currentRoomName');
                if (roomNameEl) roomNameEl.textContent = data.roomName;

                const limitInfo = document.getElementById('roomLimitInfo');
                if (limitInfo) {
                    limitInfo.textContent = roomLimitType === 'PotLimit' ? 'POT LIMIT' : 'NO LIMIT';
                    limitInfo.classList.toggle('no-limit', roomLimitType !== 'PotLimit');
                }

                const roomListSection = document.getElementById('roomListSection');
                const gameSection = document.getElementById('gameSection');
                if (roomListSection) roomListSection.style.display = 'none';
                if (gameSection) gameSection.classList.add('active');

                if (data.hand && data.hand.length > 0) {
                    myHand = data.hand;
                    displayHand();
                }

                showMessage("Otağa qoşuldunuz!", "success");
            });

            connection.on("RoomStartTimer", (remainingSeconds) => {
                const badge = document.getElementById('roomTimerBadge');
                const value = document.getElementById('roomTimerValue');
                if (badge && value) {
                    badge.classList.remove('hidden');
                    value.textContent = remainingSeconds;
                    badge.classList.toggle('warning', remainingSeconds <= 10);
                }
            });

            connection.on("RoomStartTimeout", (message) => {
                const badge = document.getElementById('roomTimerBadge');
                if (badge) badge.classList.add('hidden');
                fold();
                showMessage(message, "success");
            });

            connection.on("RoomStarting", (message) => {
                const badge = document.getElementById('roomTimerBadge');
                if (badge) badge.classList.add('hidden');
                showMessage(message, "success");
            });

            connection.on("JoinError", (message) => showMessage(message, "error"));
            connection.on("LeaveError", (message) => showMessage(message, "error"));

            connection.on("PlayerJoined", (playerName) => {
                showMessage(playerName + " qoşuldu", "info");
                loadRoomList();
            });

            connection.on("PlayerLeft", (playerName) => {
                const name = playerName?.playerName || playerName;
                console.log('👤 PlayerLeft:', name);
                showMessage(name + " çıxdı", "info");
            });

            connection.on("PlayersList", (players) => {
                console.log('👥 PlayersList:', players);
                updatePlayersList(players);
                updatePlayersOnTable(players); // ✅ masa dərhal yenilənir

                if (players.length === 0 && currentRoomId) {
                    currentRoomId = null;
                    myHand = [];
                    roomEntryFee = 0;
                    nextCallAmount = 0;
                    currentTurnUserId = 0;
                    stopTurnTimer();
                    resetGameUI();

                    const gameSection = document.getElementById('gameSection');
                    if (gameSection) gameSection.classList.remove('active');

                    const roomListSection = document.getElementById('roomListSection');
                    if (roomListSection) roomListSection.style.display = 'block';

                    loadRoomList();
                    showMessage('Otaq boşaldı', 'info');
                }
            });
            connection.on("PotUpdated", (data) => {
                console.log('💰 PotUpdated received:', data);

                // ✅ DATA TİPİ KONTROL
                let potValue = 0;

                if (typeof data === 'number') {
                    // ESKI FORMAT: PotUpdated(amount) - sayı olarak
                    potValue = data;
                    console.log('📊 Pot (number):', potValue);

        function setQuickRaise(multiplier) {
            const minRaiseIncrement = getDisplayedRaiseMin();
            const maxRaiseIncrement = getDisplayedRaiseMax();
            let raiseIncrement;
            if (multiplier === 'allin') {
                raiseIncrement = Math.min(myBalance + myCurrentBet, maxRaiseIncrement);
            } else {
                raiseIncrement = Math.round(minRaiseIncrement * multiplier * 100) / 100;
            }

            raiseIncrement = Math.min(raiseIncrement, maxRaiseIncrement);
            raiseIncrement = Math.max(raiseIncrement, minRaiseIncrement);

            const input = document.getElementById('raiseInput');
            if (input) {
                input.value = raiseIncrement.toFixed(2);
            }

            document.getElementById('raiseValue').textContent = `${raiseIncrement.toFixed(2)} ₼`;

            document.querySelectorAll('.quick-raise-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            const btnId = multiplier === 'allin' ? 'raiseAllin' : `raise${multiplier}x`;
            const selectedBtn = document.getElementById(btnId);
            if (selectedBtn) selectedBtn.classList.add('selected');

            console.log(`🎯 Quick raise seçildi: ${multiplier}x | məbləğ=${raiseIncrement.toFixed(2)}₼`);
        }

        async function raise() {
            const input = document.getElementById('raiseInput');
            const raiseValueEl = document.getElementById('raiseValue');

            const cleanValue = (input?.value || '0').replace(',', '.');
            const minRaise = minRaiseAmount > 0 ? minRaiseAmount : roomEntryFee;
            const maxRaise = maxRaiseAmount > 0 ? maxRaiseAmount : roomEntryFee * 100;
            const minDisplayedRaise = getDisplayedRaiseMin();
            const maxDisplayedRaise = getDisplayedRaiseMax();
            const raiseAmount = parseFloat(cleanValue);

            console.log('🎯 RAISE INPUT:', {
                raw: input?.value,
                cleaned: cleanValue,
                raiseAmount: raiseAmount,
                minRaise: minRaise,
                maxRaise: maxRaise
            });

            if (isNaN(raiseAmount) || raiseAmount < minDisplayedRaise) {
                if (input) {
                    input.value = minDisplayedRaise.toFixed(2);
                }
                if (raiseValueEl) {
                    raiseValueEl.textContent = `${minDisplayedRaise.toFixed(2)} ₼`;
                }
                showMessage(`❌ Minimum raise məbləği: ${minDisplayedRaise.toFixed(2)}₼`, "error");
                return;
            }

            if (raiseAmount > maxDisplayedRaise) {
                showMessage(`❌ Maksimum raise məbləği: ${maxDisplayedRaise.toFixed(2)}₼`, "error");
                return;
            }

            try {
                if (!connection || connection.state !== signalR.HubConnectionState.Connected) {
                    showMessage("Bağlantı hazır deyil", "error");
                    return;
                }

                const exactAmount = Math.round(raiseAmount * 100) / 100;
                if (exactAmount <= 0) {
                    if (input) {
                        input.value = minDisplayedRaise.toFixed(2);
                    }
                    if (raiseValueEl) {
                        raiseValueEl.textContent = `${minDisplayedRaise.toFixed(2)} ₼`;
                    }
                    showMessage(`❌ Minimum raise məbləği: ${minDisplayedRaise.toFixed(2)}₼`, "error");
                    return;
                }

                console.log('📤 Raise məbləği göndərilir:', exactAmount);
                await connection.invoke("Raise", exactAmount);
                stopTurnTimer();

                document.getElementById('raiseBtn').disabled = true;
                document.getElementById('raiseInput').disabled = true;
                document.querySelectorAll('.quick-raise-btn').forEach(btn => btn.disabled = true);

            } catch (error) {
                showMessage("Raise xətası: " + error.message, "error");
            }
        }

        async function sendHandPauseDecision(continuePlaying) {
            try {
                if (!connection || connection.state !== signalR.HubConnectionState.Connected) {
                    showMessage("Bağlantı hazır deyil", "error");
                    return;
                }

                if (handPauseDecisionSending) {
                    console.warn('⏸️ HandPauseDecision already sending, duplicate click ignored');
                    return;
                }

                const sessionId = currentHandPauseSessionId;
                if (!sessionId) {
                    showMessage("Pauza sessiyası tapılmadı", "error");
                    return;
                }

                handPauseDecisionSending = true;
                const continueBtn = document.getElementById('handPauseContinueBtn');
                const timeoutBtn = document.getElementById('handPauseTimeoutBtn');
                if (continueBtn) continueBtn.disabled = true;
                if (timeoutBtn) timeoutBtn.disabled = true;

                console.log('⏸️ HandPauseDecision sending:', {
                    continuePlaying,
                    sessionId,
                    sentAt: new Date().toISOString()
                });

                await connection.invoke("HandPauseDecision", continuePlaying, sessionId);

                if (continuePlaying) {
                    showMessage("Cavab göndərildi. Növbəti əl gözlənilir.", "success");
                }
            } catch (error) {
                handPauseDecisionSending = false;
                const continueBtn = document.getElementById('handPauseContinueBtn');
                const timeoutBtn = document.getElementById('handPauseTimeoutBtn');
                if (continueBtn) continueBtn.disabled = false;
                if (timeoutBtn) timeoutBtn.disabled = false;
                showMessage("Pause timeout xətası: " + error.message, "error");
            }
        }

        // ==================== TIMER FUNCTIONS ====================
        function startTurnTimer() {
            stopTurnTimer();
            if (currentTurnUserId !== currentUserId || turnTimeRemaining <= 0) return;

            currentTimer = setInterval(() => {
                turnTimeRemaining--;
                updateAllPlayerTimers();

                if (turnTimeRemaining <= 0) {
                    stopTurnTimer();
                    // Avtomatik fold
                    if (currentTurnUserId === currentUserId) {
                        showMessage("Vaxtınız bitdi! Avtomatik fold...", "error");
                        fold(); // Avtomatik fold funksiyasını çağır
                    }
                }
            }, 1000);

            updateAllPlayerTimers();

        // ✅ YENİ - Frontend xal hesablama funksiyası
        function calculateHandScore(hand) {
            if (!hand || hand.length !== 3) return 0;

            // ✅ Kart dəyəri funksiyası
            const getCardValue = (rank) => {
                if (rank === 'A') return 11;
                if (['K', 'Q', 'J'].includes(rank)) return 10;
                return parseInt(rank) || 0;
            };

            // ✅ Rəngə görə qruplaşdır
            const suitGroups = {};
            hand.forEach(card => {
                if (!suitGroups[card.suit]) suitGroups[card.suit] = [];
                suitGroups[card.suit].push(card);
            });

            const suitScores = Object.values(suitGroups)
                .map(group => group.reduce((sum, card) => sum + getCardValue(card.rank), 0));

            const hasSameSuitCards = Object.values(suitGroups).some(group => group.length > 1);

            if (hasSameSuitCards) {
                return Math.max(...suitScores);
            }

            // Backend-lə eyni: heç eyni suit yoxdursa yalnız ən yüksək kart sayılır.
            return Math.max(...hand.map(card => getCardValue(card.rank)));
        }

            floater.style.left = '50%';
            floater.style.top = '50%';
            spot.appendChild(floater);
            setTimeout(() => floater.remove(), 2000);
        }

        // ==================== SHOWDOWN ====================
        function showShowdown(players) {
            ensureShowdownOverlay();
            const overlay = document.getElementById('showdownOverlay');
            const container = document.getElementById('showdownPlayers');

            const getSuitClass = (suit) => {
                if (suit === '♥') return 'hearts';
                if (suit === '♦') return 'diamonds';
                if (suit === '♣') return 'clubs';
                if (suit === '♠') return 'spades';
                const n = suit.toLowerCase();
                if (n.includes('heart') || n.includes('ürək')) return 'hearts';
                if (n.includes('diamond') || n.includes('karo')) return 'diamonds';
                if (n.includes('club') || n.includes('çətənə')) return 'clubs';
                if (n.includes('spade') || n.includes('pika')) return 'spades';
                return 'hearts';
            };

            container.innerHTML = players.map(p => {
                // ✅ XALI HESABLA
                const handScore = calculateHandScore(p.hand);

                return `
                                    <div class="showdown-player">
                                        <div class="showdown-player-header">
                                            <div class="showdown-player-name">${userNameEl}</div>
                                            <div style="font-size: 1.5rem; color: #ffd700;">
                                                Xal: ${handScore}
                                            </div>
                                        </div>
                                        <div class="showdown-hand-name">${p.handValue?.rank || 'Gözləyin...'}</div>
                                        <div class="showdown-cards">
                                            ${p.hand.map(card => `
                                                <div class="showdown-card ${getSuitClass(card.suit)}">
                                                    <div style="font-size: 1.8rem;">${card.rank}</div>
                                                    <div style="font-size: 2rem;">${card.suit}</div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
            }).join('');

            overlay.classList.add('active');
        }
        function handleGameOver(data) {
            ensureShowdownOverlay();
            const winnerDiv = document.getElementById('showdownWinner');

            const getSuitClass = (suit) => {
                if (suit === '♥') return 'hearts';
                if (suit === '♦') return 'diamonds';
                if (suit === '♣') return 'clubs';
                if (suit === '♠') return 'spades';
                const normalized = suit.toLowerCase();
                if (normalized.includes('heart') || normalized.includes('ürək')) return 'hearts';
                if (normalized.includes('diamond') || normalized.includes('karo')) return 'diamonds';
                if (normalized.includes('club') || normalized.includes('çətənə')) return 'clubs';
                if (normalized.includes('spade') || normalized.includes('pika')) return 'spades';
                return 'hearts';
            };

            if (data.results && data.results.length > 0) {
                const container = document.getElementById('showdownPlayers');

                container.innerHTML = data.results.map(p => {
                    // ✅ XALI HESABLA
                    const handScore = calculateHandScore(p.hand);

                    return `
                                        <div class="showdown-player ${p.isWinner ? 'winner' : ''}">
                                            <div class="showdown-player-header">
                                                <div class="showdown-player-name ${p.isWinner ? 'winner' : ''}">
                                                    ${p.rank}. ${p.name}
                                                </div>
                                                ${p.isWinner ? '<div style="color: #ffd700; font-size: 2rem;">👑</div>' : ''}
                                            </div>
                                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                                                <div class="showdown-hand-name">${p.handName}</div>
                                                <div style="font-size: 1.3rem; color: #ffd700; font-weight: bold;">
                                                    Xal: ${handScore}
                                                </div>
                                            </div>
                                            <div class="showdown-cards">
                                                ${p.hand.map(card => `
                                                    <div class="showdown-card ${getSuitClass(card.suit)}">
                                                        <div style="font-size: 1.8rem;">${card.rank}</div>
                                                        <div style="font-size: 2rem;">${card.suit}</div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    `;
                }).join('');
            }

            if (data.winMode === 'split' || data.winners) {
                winnerDiv.innerHTML = `
                                    🎊 Qaliblər: ${data.winners.join(', ')} 🎊<br>
                                    Hər biri qazandı: ${data.amount.toFixed(2)}₼
                                    <div class="commission-info">Komissiya (${(((data.commissionRate ?? 0.03) * 100).toFixed(0))}%): ${data.commission.toFixed(2)}₼</div>
                                    ${data.tiedCount ? `<div class="commission-info">Eyni xal: ${data.tiedCount} nəfər</div>` : ''}
                                `;
            } else {
                winnerDiv.innerHTML = `
                                    🎊 Qalib: ${data.winner} 🎊<br>
                                    Qazanc: ${data.amount.toFixed(2)}₼
                                    <div class="commission-info">Komissiya (${(((data.commissionRate ?? 0.03) * 100).toFixed(0))}%): ${data.commission.toFixed(2)}₼</div>
                                `;
            }

            document.getElementById('showdownOverlay').classList.add('active');
        }
        function closeShowdown() {
            document.getElementById('showdownOverlay').classList.remove('active');
        }

        // ==================== UTILITY ====================
        function showMessage(text, type = 'info') {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            document.body.appendChild(msg);

            setTimeout(() => msg.remove(), 4000);
        }

        function resetGameUI() {
            try {
                myHand = [];
                nextCallAmount = 0;
                currentGameBet = 0;
                myCurrentBet = 0;
                potAmount = 0;
                displayHand();

                const potEl = document.getElementById('potAmount');
                const betEl = document.getElementById('currentBetAmount');
                const callEl = document.getElementById('callAmount');
                if (potEl) potEl.textContent = '0';
                if (betEl) betEl.textContent = '0';
                if (callEl) callEl.textContent = '0';

                // ✅ Call və Showdown düymələrini sıfırla
                const callBtn = document.getElementById('callBtn');
                if (callBtn) callBtn.innerHTML = `📞 CALL (0.00₼)`;

                const scBtn = document.getElementById('showdownCallBtn');
                if (scBtn) scBtn.innerHTML = `Showdown Call (0.00₼) 🎴`;

                // ✅ Raise input-u sıfırla
                const raiseInput = document.getElementById('raiseInput');
                const raiseValue = document.getElementById('raiseValue');
                if (raiseInput) raiseInput.value = '0';
                if (raiseValue) raiseValue.textContent = '0 ₼';

                // ✅ Slider limitlərini sıfırla
                updateSliderLimits();

                // ✅ Bütün düymələri deaktiv et
                ['foldBtn', 'callBtn', 'raiseBtn', 'allInBtn', 'showdownCallBtn'].forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) {
                        btn.disabled = true;
                        btn.style.opacity = '0.5';
                        // ✅ showdownCallBtn üçün golden-glow-u da sil
                        if (id === 'showdownCallBtn') {
                            btn.classList.remove('golden-glow');
                        }
                    }
                });

                stopTurnTimer();
                turnTimeRemaining = 0;
                isInSvara = false;
                svaraRound = 0;

                console.log('✅ resetGameUI tamamlandı');
            } catch (e) {
                console.error('❌ resetGameUI xətası:', e);
            }
        }
        const minimalStyles = document.createElement('style');
        minimalStyles.textContent = `
                                    .pending-bet {
                                        animation: pendingPulse 1.5s infinite;
                                    }

                                    @keyframes pendingPulse {
                                        0%, 100%y {
                                            transform: scale(1);
                                            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.6);
                                        }
                                        50% {
                                            transform: scale(1.05);
                                            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.9);
                                        }
                                    }
                                `;
        document.head.appendChild(minimalStyles);
    </script>
</body>
</html>
